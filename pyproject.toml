[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kalkan"
version = "1.16.1"
description = "Resumable, AI-assisted security audit toolkit driven by Claude Code."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The kalkan authors", email = "kalkan@dtechcloud.com" }]
keywords = ["security", "sast", "sca", "audit", "claude-code"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[project.scripts]
kalkan = "kalkan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kalkan"]

# The wheel carries the read-only data, so that an installed kalkan needs no checkout
# (kalkan.resources, docs/ENGINE-SPEC.md section 24). A checkout reads the folders in place.
[tool.hatch.build.targets.wheel.force-include]
"knowledge" = "kalkan/_data/knowledge"
"rules" = "kalkan/_data/rules"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["third_party", "knowledge"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
markers = [
    "tools: needs an installed external scanner (skipped when the tool is missing)",
    "docker: needs a running Docker engine (skipped when Docker is unavailable)",
]
