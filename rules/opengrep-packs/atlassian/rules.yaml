            - pattern: org.omg.CORBA_2_3.ORB
    metadata:
      cwe:
        - "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/LDAP_Injection_Prevention_Cheat_Sheet.html
        - https://www.veracode.com/blog/research/exploiting-jndi-injections-java
    paths:
      include:
        - "*.java"
  # source: rules/atlassian-internal-soy.yaml
  - id: int-soy-html-noautoescape
    languages: [ generic ]
    severity: ERROR
    message: >
      The `noAutoescape` directive is being used within a Soy template that is explicitly defined with `kind="html"`.
      Soy templates with kind="html" are designed to generate HTML content and by default, they automatically escape
      any dynamic values to prevent unsafe HTML injection. However, using `noAutoescape` overrides this behavior,
      disabling the automatic escaping mechanism. This can inadvertently expose the application to security
      vulnerabilities such as cross-site scripting (XSS) attacks, where malicious actors could inject harmful scripts
      into the generated HTML. To maintain robust security practices and ensure proper sanitization of dynamic content,
      it is strongly recommended to avoid using `noAutoescape` in `kind="html"` templates and rely on Soy's built-in
      escaping mechanisms
    metadata:
      category: security
    patterns:
      - pattern-inside: "{template ... kind=\"html\"} ... {/template}"
      - pattern: "{$... |noAutoescape}"
    paths:
      include:
        - "*.soy"
  # source: rules/atlassian-internal-spring-core.yaml
  - id: int-spcore-insecure-editor
    languages:
      - java
    severity: ERROR
    message: >
      Spring DataBinder(s) should not be used for arbitrary and generic
      types. Make sure the DataBinder(s) used for mapping incoming data in a
      request is secure and does not serialize/deserialize objects of arbitrary
      or unsafe types, which in this case is `$SERDE_TYPE`.
    patterns:
      - pattern-either:
          - pattern: ($TYPE $VAR).registerCustomEditor($SERDE_TYPE, ...)
      - pattern-inside: |-
          @InitBinder
          public void $METHOD($TYPE binder) {
          ...
          }
      - metavariable-pattern:
          metavariable: $TYPE
          pattern-either:
            - pattern: org.springframework.validation.DataBinder
            - pattern: org.springframework.web.bind.WebDataBinder
            - pattern: org.springframework.web.bind.ServletRequestDataBinder
            - pattern: org.springframework.web.servlet.mvc.method.annotation.ExtendedServletRequestDataBinder
            - pattern: org.springframework.web.bind.support.WebExchangeDataBinder
            - pattern: org.springframework.web.reactive.result.method.annotation.ExtendedWebExchangeDataBinder
            - pattern: org.springframework.web.bind.support.WebRequestDataBinder
      - metavariable-pattern:
          metavariable: $SERDE_TYPE
          pattern-either:
            - pattern: Class.class
            - pattern: Object.class
            - pattern: Serializable.class
            - pattern: File.class
    metadata:
      cwe:
        - "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      references:
        - https://docs.spring.io/spring-framework/reference/web/webflux/controller/ann-initbinder.html
    paths:
      include:
        - "*.java"
  # source: rules/atlassian-internal-spring-el.yaml
  - id: int-spel-insecure-parse
    languages:
      - java
    severity: ERROR
    message: >
      User controlled input is directly fed into the `($CTX_TYPE $CTX).$SINK(...)`
      method. The entry happens through `($REQ_TYPE $REQ).$SOURCE(...)`. This is a
      known vulnerability pattern that can lead to many different types of issue
      including but not limited to RCE. Make sure to sanitize user controlled
      inputs before evaluating untrusted inputs as Spring Expressions.
      
      
      If we pass user-controlled input data into the `parser.parseExpression("...")` call, an adversary can easily
      manipulate and inject custom expressions, which can lead to various breaches.
      
      
      When using SpEL, it is important to be cautious about potential security vulnerabilities, such as injection
      attacks. To mitigate these risks, developers should avoid using user input directly in SpEL expressions and
      validate any input before evaluating expressions. Additionally, limiting the scope of SpEL expressions to
      trusted sources can help prevent unauthorized access to sensitive data or system resources.
    patterns:
      - pattern-either:
          - pattern: ($CTX_TYPE $CTX).$SINK(..., ... + ($REQ_TYPE $REQ). ... .$SOURCE(...) +
              ..., ...);
          - pattern: ($CTX_TYPE $CTX).$SINK(..., ($REQ_TYPE $REQ). ... .$SOURCE(...) + ...,
              ...);
          - pattern: ($CTX_TYPE $CTX).$SINK(..., ... + ($REQ_TYPE $REQ). ... .$SOURCE(...),
              ...);
          - pattern: ($CTX_TYPE $CTX).$SINK(..., ($REQ_TYPE $REQ). ... .$SOURCE(...), ...);
      - metavariable-regex:
          metavariable: $SOURCE
          regex: ^get[A-Za-z0-1]*$
      - metavariable-pattern:
          metavariable: $REQ_TYPE
          pattern-either:
            - pattern: HttpServletRequest
            - pattern: ServletRequest
            - pattern: ServletRequestWrapper
            - pattern: HttpServletRequestWrapper
      - metavariable-pattern:
          metavariable: $CTX_TYPE
          pattern-either:
            - pattern: org.springframework.expression.ExpressionParser
            - pattern: org.springframework.expression.common.TemplateAwareExpressionParser
            - pattern: org.springframework.expression.spel.standard.SpelExpressionParser
      - metavariable-pattern:
          metavariable: $SINK
          pattern-either:
            - pattern: parseExpression
            - pattern: doParseExpression
            - pattern: parseRaw
    metadata:
      cwe:
        - "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      references:
        - https://docs.spring.io/spring-framework/docs/current/reference/html/core.html#expressions
        - https://docs.spring.io/spring-security/reference/servlet/authorization/method-security.html#use-programmatic-authorization
    paths:
      include:
        - "*.java"
  - id: int-spel-bad-prop-accessor
    languages:
      - java
    severity: ERROR
    message: >
      The $CLASS_NAME.getPropertyAccessors() should not return an empty list.
      Returning an empty list essentially bypasses all authorization and access
      checks leaving the expression parser vulnerable to attacks. Implement a
      secure property accessor in the $CLASS_NAME.
      
      
      Sample code with correct property accessor implementation:
      {code:java}
      public class SecurePropertyAccessorProvider {
          // Always return a non-empty list of secure property accessors
          public List<PropertyAccessor> getPropertyAccessors() {
              // Use Spring's built-in ReflectivePropertyAccessor or a custom secure implementation
              return Collections.singletonList(new SecurePropertyAccessor());
          }
          // Example of a secure custom property accessor
          static class SecurePropertyAccessor extends ReflectivePropertyAccessor {
              @Override
              public boolean canRead(org.springframework.expression.EvaluationContext context, Object target, String name) {
                  // Add security checks here (e.g., authorization, field whitelisting)
                  if (isSensitiveField(name)) {
                      throw new SecurityException("Access to sensitive field '" + name + "' is not allowed.");
                  }
                  return super.canRead(context, target, name);
              }
              private boolean isSensitiveField(String fieldName) {
                  // Example: Restrict access to sensitive fields
                  return "password".equals(fieldName) || "ssn".equals(fieldName);
              }
          }
      }
      {code}
    patterns:
      - pattern-either:
          - pattern: |-
              class $CLASS_NAME extends $BASE_CLASS_NAME {
                public List<PropertyAccessor> getPropertyAccessors() {
                  return $ACCESSORS;
                }
              }
          - pattern: |-
              class $CLASS_NAME extends $BASE_CLASS_NAME {
                @Override
                public List<PropertyAccessor> getPropertyAccessors() {
                  return $ACCESSORS;
                }
              }
      - metavariable-pattern:
          metavariable: $BASE_CLASS_NAME
          pattern-either:
            - pattern: SimpleEvaluationContext
            - pattern: StandardEvaluationContext
      - metavariable-pattern:
          metavariable: $ACCESSORS
          pattern-either:
            - pattern: Arrays.asList();
            - pattern: Collections.emptyList();
            - pattern: List.of();
            - pattern: new ArrayList<>();
            - pattern: new LinkedList<>();
    metadata:
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      references:
        - https://docs.spring.io/spring-framework/docs/current/reference/html/core.html#expressions
        - https://docs.spring.io/spring-security/reference/servlet/authorization/method-security.html#use-programmatic-authorization
        - https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/expression/PropertyAccessor.html
    paths:
      include:
        - "*.java"
  - id: int-spel-auth-bypass
    languages:
      - java
    severity: ERROR
    message: >
      The $CLASS_NAME.canRead() should not return a hardcoded `true`.
      Returning true always essentially bypasses all authorization and access
      checks leaving the expression parser vulnerable to attacks. Implement a
      secure canRead(...) method in the $CLASS_NAME.
      
      
      Sample code with correct property accessor implementation:
      {code:java}
      public class SecurePropertyAccessorProvider {
          // Always return a non-empty list of secure property accessors
          public List<PropertyAccessor> getPropertyAccessors() {
              // Use Spring's built-in ReflectivePropertyAccessor or a custom secure implementation
              return Collections.singletonList(new SecurePropertyAccessor());
          }
          // Example of a secure custom property accessor
          static class SecurePropertyAccessor extends ReflectivePropertyAccessor {
              @Override
              public boolean canRead(org.springframework.expression.EvaluationContext context, Object target, String name) {
                  // Add security checks here (e.g., authorization, field whitelisting)
                  if (isSensitiveField(name)) {
                      throw new SecurityException("Access to sensitive field '" + name + "' is not allowed.");
                  }
                  return super.canRead(context, target, name);
              }
              private boolean isSensitiveField(String fieldName) {
                  // Example: Restrict access to sensitive fields
                  return "password".equals(fieldName) || "ssn".equals(fieldName);
              }
          }
      }
      {code}
    patterns:
      - pattern: >
          public boolean canRead(...) {
            return true;
          }
      - pattern-inside: |
          class $CLASS_NAME extends ReflectivePropertyAccessor {
          ...
          }
    metadata:
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      references:
        - https://docs.spring.io/spring-framework/docs/current/reference/html/core.html#expressions
        - https://docs.spring.io/spring-security/reference/servlet/authorization/method-security.html#use-programmatic-authorization
        - https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/expression/PropertyAccessor.html
    paths:
      include:
        - "*.java"
  # source: rules/atlassian-internal-spring-security.yaml
  - id: int-spsec-bad-pwd-encoder
    languages:
      - java
    severity: ERROR
    message: >
      The `StandardPasswordEncoder` is deprecated and its use is highly discouraged since it does not include salting,
      making it vulnerable to certain bruteforce attacks. Similarly, the `NoOpPasswordEncoder` stores passwords in
      plaintext, exposing them directly if the database is compromised. There are several other such `PasswordEncoder`
      implementations that exist entirely for backward compatibility and should not be used.
      
      
      It is recommended to use one of the secure password encoders like `BCrypt`, `Argon2`, `PBKDF2`.
      These are modern, adaptive and cryptographically secure hashing algorithms. They are designed to be
      resource-intensive, which slows down brute-force attacks significantly.
      
      
      Salting and Iteration - These algorithms inherently support salting and allow configuration of iterations to
      increase the time taken to hash passwords, enhancing security against attacks.
      
      
      Future-Proofing - By using `DelegatingPasswordEncoder`, the application can easily transition to even more
      secure algorithms in the future as best practices evolve.
    patterns:
      - pattern-either:
          - pattern: new StandardPasswordEncoder(...)
          - pattern: StandardPasswordEncoder.newInstance(...)
          - pattern: new NoOpPasswordEncoder(...)
          - pattern: NoOpPasswordEncoder.newInstance(...)
    metadata:
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      references:
        - https://docs.spring.io/spring-security/reference/servlet/authentication/passwords/password-encoder.html
        - https://docs.spring.io/spring-security/reference/features/authentication/password-storage.html#authentication-password-storage
    paths:
      include:
        - "*.java"
  - id: int-spsec-insecure-csrf
    languages:
      - java
    severity: ERROR
    message: >
      Disabling CSRF protection for endpoints that handle state-changing operations can lead to client-side attacks.
      CSRF protections are critical wherever transactions or critical state-changing operations are involved, as they
      prevent malicious actors from tricking users into performing unintended actions on their behalf. In the current
      configuration, CSRF protection has been disabled for certain endpoints, as indicated in variable $VAR. This
      exposes the application to potential exploitation by attackers who can craft malicious requests to manipulate
      user actions.
      
      
      Endpoint Restrictions - Only specific endpoints, such as login and registration, should be accessible without
      authentication, reducing the attack surface.
      
      
      CSRF Protection - Ensure that CSRF protection is enabled for all endpoints handling state-changing operations.
      This includes using secure anti-CSRF tokens and validating them on the server side to prevent unauthorized actions.
    patterns:
      - pattern-either:
          - pattern: $VAR. ... .csrf().disable()
    metadata:
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      references:
        - https://docs.spring.io/spring-security/reference/servlet/exploits/csrf.html
    paths:
      include:
        - "*.java"
  - id: int-spsec-insecure-sessfix
    languages:
      - java
    severity: ERROR
    message: >
      Session fixation is a vulnerability where an attacker hijacks a victim's session by forcing or reusing a known
      session ID. Protection against session fixation is critical to ensure that attackers cannot exploit session
      management to impersonate legitimate users. In the current configuration, session fixation protection has been
      disabled, as indicated in variable $VAR. This exposes the application to the risk of session hijacking and
      unauthorized access.
      
      
      Session Fixation Protection - Configuring session management to create a new session upon login is essential to
      prevent attackers from reusing session IDs. This ensures that any session established before authentication cannot
      be exploited by an attacker.
      
      
      Concurrent Session Control - Limiting concurrent sessions per user helps protect against session hijacking and
      ensures account integrity.
      
      
      Endpoint Restrictions - Only specific endpoints, such as login and registration, should be accessible without
      authentication, reducing the attack surface.
    patterns:
      - pattern-either:
          - pattern: $VAR. ... .sessionFixation().none()
    metadata:
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      references:
        - https://docs.spring.io/spring-security/reference/servlet/exploits/headers.html
    paths:
      include:
        - "*.java"
  - id: int-spsec-open-firewall
    languages:
      - java
    severity: ERROR
    message: >
      In Spring Security, the DefaultHttpFirewall is a component responsible for
      filtering HTTP requests to enforce security constraints. It acts as a
      gatekeeper, inspecting incoming requests and rejecting those that contain
      potentially dangerous or malformed data. The DefaultHttpFirewall provides
      a basic level of protection by blocking requests with certain suspicious
      or invalid characters in the URL, such as double slashes or semicolons,
      which can be used in path traversal or injection attacks.

      However, the `DefaultHttpFirewall` is considered insecure because it is relatively permissive in what it allows
      through. It is designed to be compatible with a wide range of applications and use cases, which means it may
      not block all potentially harmful requests. This permissiveness can leave applications vulnerable to certain
      types of attacks if they rely solely on the default firewall settings for security.

      In contrast, the `StrictHttpFirewall` is a more secure alternative provided by Spring Security. It enforces
      stricter validation rules on incoming requests, blocking any requests that contain characters or patterns deemed
      unsafe. By default, the StrictHttpFirewall rejects requests with semicolons, backslashes and other potentially
      dangerous characters in the URL. This stricter approach reduces the risk of common web vulnerabilities such as
      path traversal, HTTP response splitting and other injection attacks.

      Using the `StrictHttpFirewall` is recommended for applications that require a higher level of security and can
      operate within the constraints of its stricter validation rules. It provides a more robust defense against
      malicious requests and helps ensure that only well-formed and safe requests are processed by the application.
    patterns:
      - pattern: new DefaultHttpFirewall()
    metadata:
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      references:
        - https://docs.spring.io/spring-security/reference/servlet/exploits/firewall.html
    paths:
      include:
        - "*.java"
  # source: rules/atlassian-internal-xstream.yaml
  - id: int-xstream-open-perm
    languages: [ java ]
    severity: ERROR
    message: >
      The use of `AnyTypePermission.ANY` in your code permits the deserialization of any class without restriction.
      This practice is highly insecure as it opens the door to critical vulnerabilities, including Remote Code
      Execution (RCE). By allowing arbitrary classes to be deserialized, attackers can potentially inject malicious
      payloads, execute unauthorized code or exploit your application in other harmful ways. To mitigate these risks,
      it is strongly recommended to use a more restrictive deserialization policy that explicitly defines and limits
      the classes that can be deserialized.
    metadata:
      category: security
      cwe: "CWE-937: Improper Access Control"
      references:
        - https://x-stream.github.io/security.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
    pattern-either:
      - pattern: $XSTREAM.addPermission(AnyTypePermission.ANY);
      - pattern: AnyTypePermission.ANY
    paths:
      include:
        - "*.java"
  - id: int-xstream-bad-blocklist
    languages: [ java ]
    severity: WARNING
    message: >
      The use of `xstream.denyTypes()` relies on a blocklist approach to restrict certain types. However, blocklists
      are inherently fragile and can often be bypassed by attackers using creative techniques to introduce malicious
      or unexpected types. This makes relying solely on denyTypes() an insufficient security measure. It is recommended
      to adopt a more robust allowlist approach, such as xstream.allowTypes(), which explicitly specifies the types
      that are permitted, thereby reducing the risk of exploitation and enhancing the overall security of your
      application.
    metadata:
      category: security
      cwe: "CWE-670: Always-Incomplete Blacklist"
      references:
        - https://x-stream.github.io/security.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
    pattern-either:
      - pattern: $XSTREAM.denyTypes(...)
      - pattern: $XSTREAM.denyPermission(...)
    paths:
      include:
        - "*.java"
  - id: int-xstream-wildcard-perm
    languages: [ java ]
    severity: ERROR
    message: >
      The use of `xstream.allowTypesByWildcard()` introduces a security risk by allowing the inclusion of classes based
      on broad, unchecked patterns. This permissive approach can be exploited by attackers to load malicious or
      unexpected classes, including potentially dangerous proxies, leading to vulnerabilities such as remote code
      execution or data manipulation. To ensure safer deserialization practices, it is recommended to adopt stricter
      controls by explicitly specifying allowed classes or using more secure alternatives.
    metadata:
      category: security
      cwe: "CWE-470: Use of Externally-Controlled Input to Select Classes or Code"
      references:
        - https://x-stream.github.io/security.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
    mode: taint
    options:
      taint_unify_mvars: true
    pattern-sources:
      - patterns:
          - pattern: (com.thoughtworks.xstream.XStream $X).allowTypesByWildcard(...)
          - focus-metavariable: $X
        by-side-effect: true
    pattern-sinks:
      - pattern: (com.thoughtworks.xstream.XStream $X).fromXML(...)
    paths:
      include:
        - "*.java"
  - id: int-xstream-bad-custom-converter
    languages: [ java ]
    severity: ERROR
    message: >
      Using insecure XStream custom converters to handle potentially dangerous types can expose your application to
      deserialization attacks in `$XSTREAM.registerConverter(...)`. Deserialization attacks occur when untrusted or
      malicious data is processed during deserialization, allowing attackers to execute arbitrary code, manipulate
      application behavior or exploit vulnerabilities. Custom converters that are not properly secured may inadvertently
      process unsafe data types, creating a significant security risk. It is crucial to validate and sanitize input
      data, restrict the types being deserialized and follow secure coding practices when implementing XStream custom
      converters to protect your application from such threats.
    mode: taint
    options:
      taint_unify_mvars: true
    metadata:
      category: security
      cwe: "CWE-707: Improper Neutralization"
      references:
        - https://x-stream.github.io/security.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
    pattern-sources:
      - pattern: new XStream()
    pattern-sinks:
      - pattern: $XSTREAM.registerConverter(...)
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: $XSTREAM.allowTypes(...)
              - pattern: $XSTREAM.denyTypes(...)
              - pattern: $XSTREAM.addPermission(...)
          - focus-metavariable: $XSTREAM
        by-side-effect: true
    paths:
      include:
        - "*.java"
  - id: int-xstream-insecure-unmarshal
    languages: [ java ]
    severity: ERROR
    message: >
      `XStream.unmarshal()` is being used with a custom `HierarchicalStreamReader`, which can introduce potential
      security risks. Custom implementations of HierarchicalStreamReader may not properly enforce critical XML security
      measures, such as protection against XML External Entity (XXE) attacks. XXE vulnerabilities can allow attackers
      to access sensitive data, perform denial-of-service attacks or execute malicious code by exploiting improperly
      configured XML parsers. To ensure robust security, always validate that custom readers implement sufficient
      protections or consider using a secure, well-tested alternative.
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      references:
        - https://x-stream.github.io/security.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
    patterns:
      - pattern-inside: |
          HierarchicalStreamReader $READER = new $CUSTOMREADER(...);
          ...
          $XSTREAM.unmarshal($READER);
      - pattern-not: new XppReader(...)
      - pattern-not: new DomReader(...)
      - pattern-not: new StaxReader(...)
    paths:
      include:
        - "*.java"
  - id: int-xstream-bad-instantiation
    languages: [ java ]
    severity: ERROR
    message: >
      XStream is instantiated without security configurations. Use `$X.addPermission(...)`, `$X.allowTypes(...)`,
      `$X.setupDefaultSecurity(...)` or `$X.allowTypeHierarchy(...)` to restrict the deserialization types.
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      references:
        - https://x-stream.github.io/security.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
    mode: taint
    options:
      taint_unify_mvars: true
    pattern-sources:
      - pattern: new com.thoughtworks.xstream.XStream()
    pattern-sinks:
      - pattern: $X.fromXML(...)
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: $X.addPermission(...)
              - pattern: $X.allowTypes(...)
              - pattern: $X.setupDefaultSecurity(...)
              - pattern: $X.allowTypeHierarchy(...)
          - focus-metavariable: $X
        by-side-effect: true
    paths:
      include:
        - "*.java"
  - id: int-xstream-cglibproxy-perm
    languages: [ java ]
    severity: ERROR
    message: >
      `CGLIBProxyTypePermission.PROXIES` is being added, which allows deserialization of CGLIB-generated proxy objects.
      This can lead to arbitrary code execution if an attacker crafts a malicious payload.
      
      
      Recommendation: Remove `CGLIBProxyTypePermission.PROXIES` permission, use XStream's `SecurityFramework` with explicit type
      allowlisting and implement custom converters for required classes. Consider alternatives like JSON for data
      serialization if possible.
      
      
      If CGLIB proxies are absolutely necessary: Implement strict input validation and use `SecurityFramework` with
      `NoTypePermission.NONE` as base. Add only specifically required permissions and enable XStream's `SecurityFramework`.
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      references:
        - https://x-stream.github.io/security.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
    patterns:
      - pattern-either:
          - pattern: $XSTREAM.addPermission(CGLIBProxyTypePermission.PROXIES)
          - pattern: $XSTREAM.allowTypes(CGLIBProxyTypePermission.PROXIES)
    paths:
      include:
        - "*.java"
  - id: int-xstream-proxy-type-perm
    languages: [ java ]
    severity: ERROR
    message: >
      The usage of `ProxyTypePermission.PROXIES` allows dynamic proxy types, which can lead to 
      security vulnerabilities such as unauthorized code execution or access to sensitive objects.
      
      
      Recommendation: Remove `ProxyTypePermission.PROXIES`, use explicit type allowlisting. Start with
      `NoTypePermission.NONE`, add only required specific classes. Also, consider using safer alternatives like JSON,
      Protocol Buffers (Protobuf), etc.
      
      If proxy deserialization is absolutely necessary: Use `SecurityFramework` with strict configuration, implement
      thorough input validation, limit deserialization depth and implement timeout mechanisms.
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      references:
        - https://x-stream.github.io/security.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
    pattern: |
      $XSTREAM.addPermission(ProxyTypePermission.PROXIES);
  - id: int-xstream-bad-interface-perm
    languages: [ java ]
    severity: ERROR
    message: >
      The usage of `InterfaceTypePermission.INTERFACES` allows deserialization 
      of any interface type, which may introduce remote code execution (RCE) risks.
      
      Recommendation: Avoid using `InterfaceTypePermission.INTERFACES`, use `TypePermission` to allow specific types,
      use `XStream.setupDefaultSecurity()` and implement strict input validation.
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A8: Insecure Deserialization"
      references:
        - https://x-stream.github.io/security.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
    patterns:
      - pattern: $XSTREAM.addPermission(InterfaceTypePermission.INTERFACES);
  - id: int-xstream-regexp-type-perm
    languages: [ java ]
    severity: ERROR
    message: >
      Usage of `RegExpTypePermission` in XStream can introduce security risks by allowing types based on regular
      expressions. This may unintentionally permit unsafe deserialization of arbitrary classes, leading to Remote Code
      Execution (RCE) or other vulnerabilities. Prefer explicit allow-listing of safe types instead.
    metadata:
      category: security
      cwe: "CWE-707: Improper Neutralization"
      references:
        - https://x-stream.github.io/security.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
    patterns:
      - pattern-either:
          - pattern: $XSTREAM.addPermission(new RegExpTypePermission(...))
          - pattern: |
              RegExpTypePermission $PERM = new RegExpTypePermission(...);
              $XSTREAM.addPermission($PERM);
    paths:
      include:
        - "*.java"
