  # source: rules/atlassian-internal-jmx.yaml
  - id: int-jmx-insecure-props
    languages: [ java ]
    message: >
      This code uses an insecure JMX (Java Management Extensions) configuration. Remote JMX access has been enabled
      without implementing authentication or SSL encryption. This lack of security measures exposes the application to
      potential unauthorized access and malicious attacks, putting sensitive data and system integrity at risk. It is
      essential to secure JMX connections by enforcing authentication and encrypting communication with SSL to protect
      against these vulnerabilities.
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-306: Missing Authentication for Critical Function"
      references:
        - https://blog.pentesteracademy.com/java-jmx-server-insecure-configuration-java-code-execution-295421a452f7
        - https://download.oracle.com/sunalerts/1019373.1.html
        - https://support.alertlogic.com/hc/en-us/articles/115005320166-Java-JMX-Server-Insecure-Configuration-RCE
    patterns:
      - pattern-either:
          - pattern: "System.setProperty(\"com.sun.management.jmxremote.authenticate\", \"false\")"
          - pattern: "System.setProperty(\"com.sun.management.jmxremote.ssl\", \"false\")"
      - pattern-not: "System.setProperty(\"com.sun.management.jmxremote.authenticate\", \"true\")"
      - pattern-not: "System.setProperty(\"com.sun.management.jmxremote.ssl\", \"true\")"
    fix: |
      Ensure that JMX remote connections are properly secured by enabling authentication and SSL.
  - id: int-jmx-insecure-binding
    languages:
      - java
    severity: ERROR
    message: >
      Insecure JMX network binding detected: The Java Management Extensions (JMX) service is currently configured to
      bind to all network interfaces (0.0.0.0). This means the service is accessible from any network, potentially
      exposing sensitive application management operations to unauthorized users. Such a configuration significantly
      increases the risk of exploitation, including unauthorized access, data breaches and remote attacks. To mitigate
      this risk, it is strongly recommended to restrict JMX binding to specific, trusted network interfaces or
      localhost (127.0.0.1). Additionally, ensure that proper authentication, authorization and encryption mechanisms
      are in place to safeguard the JMX service.
    fix: |
      Use a secure host binding by restricting JMX access to localhost.
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      references:
        - https://blog.pentesteracademy.com/java-jmx-server-insecure-configuration-java-code-execution-295421a452f7
        - https://download.oracle.com/sunalerts/1019373.1.html
        - https://support.alertlogic.com/hc/en-us/articles/115005320166-Java-JMX-Server-Insecure-Configuration-RCE
    patterns:
      - pattern: System.setProperty("com.sun.management.jmxremote.host", "0.0.0.0")
      - pattern-not: System.setProperty("com.sun.management.jmxremote.host", "127.0.0.1")
      - pattern-not: System.setProperty("com.sun.management.jmxremote.host", "localhost")
  # source: rules/atlassian-internal-jndi.yaml
  - id: int-jndi-lookup-sink
    languages:
      - java
    severity: ERROR
    message: >
      User controlled input is directly fed into the ($CTX_TYPE
      $CTX).$SINK(...) method. The entry happens through ($REQ_TYPE
      $REQ).$SOURCE(...). This is a known vulnerability pattern that can lead to
      many different types of issue including but not limited to RCE. Make sure
      to sanitize user controlled inputs before feeding into JNDI lookup
      methods.
    patterns:
      - pattern-either:
          - pattern: ($CTX_TYPE $CTX).$SINK(..., ... + ($REQ_TYPE $REQ). ... .$SOURCE(...) +
              ..., ...);
          - pattern: ($CTX_TYPE $CTX).$SINK(..., ($REQ_TYPE $REQ). ... .$SOURCE(...) + ...,
              ...);
          - pattern: ($CTX_TYPE $CTX).$SINK(..., ... + ($REQ_TYPE $REQ). ... .$SOURCE(...),
              ...);
          - pattern: ($CTX_TYPE $CTX).$SINK(..., ($REQ_TYPE $REQ). ... .$SOURCE(...), ...);
      - metavariable-regex:
          metavariable: $SOURCE
          regex: ^get[A-Za-z0-1]*$
      - metavariable-pattern:
          metavariable: $REQ_TYPE
          pattern-either:
            - pattern: HttpServletRequest
            - pattern: ServletRequest
            - pattern: ServletRequestWrapper
            - pattern: HttpServletRequestWrapper
      - metavariable-pattern:
          metavariable: $CTX_TYPE
          pattern-either:
            - pattern: javax.naming.Context
            - pattern: javax.naming.InitialContext
            - pattern: javax.naming.directory.DirContext
            - pattern: javax.naming.event.EventContext
            - pattern: javax.naming.event.EventDirContext
            - pattern: javax.naming.ldap.LdapContext
            - pattern: javax.naming.directory.InitialDirContext
            - pattern: javax.naming.ldap.InitialLdapContext
      - metavariable-pattern:
          metavariable: $SINK
          pattern-either:
            - pattern: lookup
            - pattern: doLookup
            - pattern: lookupLink
            - pattern: search
            - pattern: rename
    metadata:
      cwe:
        - "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/LDAP_Injection_Prevention_Cheat_Sheet.html
        - https://www.veracode.com/blog/research/exploiting-jndi-injections-java
    paths:
      include:
        - "*.java"
  - id: int-jndi-insecure-serde
    languages:
      - java
    severity: ERROR
    message: >
      Object deserialization during JNDI lookup or search is enabled in $TYPE.
      The ($TYPE $VAR) variable has `ReturningObjFlag` enabled which can lead to
      deserialization of arbitrary serialized objects and RCE. Make sure to
      disable object deserialization during search.
    patterns:
      - pattern-either:
          - pattern: new $TYPE(..., ..., ..., ..., $VAL, ...);
          - pattern: ($TYPE $VAR).setReturningObjFlag($VAL)
      - metavariable-pattern:
          metavariable: $TYPE
          pattern: SearchControls
      - metavariable-pattern:
          metavariable: $VAL
          pattern-either:
            - pattern: "true"
            - pattern: Boolean.TRUE
            - pattern: Boolean.valueOf(...)
            - pattern: Boolean.parseBoolean(...)
    metadata:
      cwe:
        - "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/LDAP_Injection_Prevention_Cheat_Sheet.html
        - https://www.veracode.com/blog/research/exploiting-jndi-injections-java
    paths:
      include:
        - "*.java"
  - id: int-jndi-corba-serde
    languages:
      - java
    severity: ERROR
    message: >
      Object deserialization using CORBA ORB APIs can lead to RCE. The
      variable ($TYPE $VAR) deserializes string into objects which is a
