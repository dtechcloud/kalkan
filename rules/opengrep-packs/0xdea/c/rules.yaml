      references:
        - https://g.co/kgs/PCHQjJ
        - https://www.sei.cmu.edu/downloads/sei-cert-c-coding-standard-2016-v01.pdf
    message: >-
      If there is no NUL character byte in the first n bytes of the source
      string, strncpy() and stpncpy() do not NUL-terminate the destination
      buffer. If the program does not explicitly terminate the destination
      buffer, this will almost certainly result in information disclosure,
      and possibly a buffer overflow condition.
    severity: WARNING
    languages:
      - c
      - cpp
    # NOTE: other functions that do not `NUL`-terminate the destination buffer are not covered (e.g., `read`, `readlink`, `fread`, `memcpy`, etc.).
    # NOTE: try to avoid false positives when `sizeof(dest) - 1` is used and in other similar cases.
    patterns:
      - pattern: $FUN(...)
      - metavariable-pattern:
          metavariable: $FUN
          pattern-either:
            - pattern: strncpy
            - pattern: stpncpy
            - pattern: wcsncpy
            - pattern: wcpncpy
            - pattern: _mbsncpy
      - pattern-not-inside: |
          $FUN($DST, $_, $_);
          ...
          $DST[$_] = NULL;
      - pattern-not-inside: |
          $FUN($DST, $_, $_);
          ...
          $DST[$_] = '\0';
      - pattern-not-inside: |
          $FUN($DST, $_, $_);
          ...
          $DST[$_] = 0;
  # source: rules/c/use-after-free.yaml
  - id: raptor-use-after-free
    metadata:
      author: Marco Ivaldi <raptor@0xdeadbeef.info>
      category: security
      subcategory:
        - vuln
      vulnerability_class: Memory Issues
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      technology:
        - c
        - cpp
      cwe:
        - "CWE-416: Use After Free"
      owasp:
        - A10:2025 - Mishandling of Exceptional Conditions
      references:
        - https://github.com/struct/mms
        - https://www.sei.cmu.edu/downloads/sei-cert-c-coding-standard-2016-v01.pdf
        - https://docs.microsoft.com/en-us/cpp/sanitizers/asan-error-examples
    message: >-
      The use of previously-freed memory can have any number of adverse
      consequences, ranging from the corruption of valid data to the
      execution of arbitrary code, depending on the instantiation and
      timing of the flaw. The simplest way data corruption may occur
      involves the system's reuse of the freed memory.
    severity: ERROR
    languages:
      - c
      - cpp
    # NOTE: C++ `delete` and `delete[]` operators are not covered (refer also to `cpp.lang.security.use-after-free.*`).
    # NOTE: `realloc` is not covered.
    patterns:
      - pattern-either:
          # generic use after free
          - pattern: $PTR->$_
          - pattern: $PTR[$_]
          - pattern: (*$PTR)
          # use after free in return
          - pattern: return $PTR;
          # use after free in function calls
          - patterns:
              - pattern-either:
                  - pattern: $FUN(..., <... $PTR ...>, ...)
                  # no need to explicitly check the following patterns, as the deep expression operator above will already match them
                  # - pattern: $FUN(..., <... $PTR->$_ ...>, ...)
                  # - pattern: $FUN(..., <... $PTR[$_] ...>, ...)
                  # - pattern: $FUN(..., <... (*$PTR) ...>, ...)
                  # - pattern: $FUN(..., <... (*$PTR).$_ ...>, ...)
                  - pattern: $PTR->$FUN(...)
              # filter out double free instances
              - metavariable-pattern:
                  metavariable: $FUN
                  patterns:
                    - pattern-not: free
      - pattern-inside: free($PTR); ...
      - pattern-not-inside: |
          free($PTR);
          ...
          $PTR = ...; 
          ...
  # source: rules/c/use-of-source-size-in-copy.yaml
  - id: raptor-use-of-source-size-in-copy
    metadata:
      author: Marco Ivaldi <raptor@0xdeadbeef.info>
      category: security
      subcategory:
        - vuln
      vulnerability_class: Memory Issues
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      technology:
        - c
        - cpp
      cwe:
        - "CWE-806: Buffer Access Using Size of Source Buffer"
      owasp:
        - A06:2025 - Insecure Design
      references:
        - https://github.com/0xdea/advisories/blob/master/2020-07-solaris-whodo-w.txt
        - https://dustri.org/b/playing-with-weggli.html
    message: >-
      The software uses the size of a source buffer when reading from or
      writing to a destination buffer, which may cause it to access memory
      that is outside of the bounds of the buffer.
    severity: ERROR
    languages:
      - c
      - cpp
    # NOTE: some copy functions such as `memccpy`, `bcopy`, and `strcpy_s` are not covered.
    # NOTE: `strlen` before the copy function is not covered.
    # NOTE: structs are not covered.
    pattern-either:
      # size of array
      - patterns:
          - pattern: $FUN($DST, $SRC, $LEN)
          - pattern-not: $FUN($DST, "...", $LEN)
          - metavariable-pattern:
              metavariable: $FUN
              pattern-either:
                - pattern: strncpy
                - pattern: stpncpy
                - pattern: strlcpy
                - pattern: strscpy
                - pattern: memcpy
                - pattern: memmove
                - pattern: wmemcpy
                - pattern: wmemmove
                - pattern: mempcpy
                - pattern: wmempcpy
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      $_ $SRC[$LEN];
                      ...
                  - pattern-not-inside: |
                      $_ $DST[$LEN];
                      ...
                  - pattern-not-inside: |
                      $_ $DST[$LEN] = ...;
                      ...
              - patterns:
                  - pattern-inside: |
                      $_ $SRC[$LEN] = ...;
                      ...
                  - pattern-not-inside: |
                      $_ $DST[$LEN];
                      ...
                  - pattern-not-inside: |
                      $_ $DST[$LEN] = ...;
                      ...
      # sizeof operator, strlen, and similar
      - patterns:
          - pattern: $FUN($DST, $SRC, <... $SRC ...>)
          - pattern-not: $FUN($DST, "...", <... $SRC ...>)
          # - pattern-not: $FUN($DST, $SRC, <... $DST ...>)
          - metavariable-pattern:
              metavariable: $FUN
              pattern-either:
                - pattern: strncpy
                - pattern: stpncpy
                - pattern: strlcpy
                - pattern: strscpy
                - pattern: memcpy
                - pattern: memmove
                - pattern: wmemcpy
                - pattern: wmemmove
                - pattern: mempcpy
                - pattern: wmempcpy
      # snprintf
      - patterns:
          - pattern: $FUN($DST, <... $SRC ...>, ..., $SRC, ...)
          # - pattern-not: $FUN($DST, <... $DST ...>, ..., $SRC, ...)
          - metavariable-pattern:
              metavariable: $FUN
              pattern-either:
                - pattern: snprintf
                - pattern: vsnprintf
                - pattern: swprintf
                - pattern: vswprintf
