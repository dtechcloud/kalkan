        - A04:2025 - Cryptographic Failures
      references:
        - https://www.sei.cmu.edu/downloads/sei-cert-c-coding-standard-2016-v01.pdf
    message: >-
      The rand() PRNG should not be used in applications intended to be 
      portable when good randomness is needed. Instead, the use of random() 
      is recommended.
    severity: WARNING
    languages:
      - c
      - cpp
    # NOTE: `rand_r` and other non-standard PRNGs are not covered.
    # NOTE: improperly seeded strong PRNGs are not covered.
    # NOTE: refer also to `cpp.lang.security.rng.*`, `cpp.lang.security.crypto.*`, and `gitlab.flawfinder.*`.
    pattern-either:
      - pattern: rand(...)
      - pattern: srand(...)
      - pattern: drand48(...)
      - pattern: erand48(...)
      - pattern: lrand48(...)
      - pattern: nrand48(...)
      - pattern: mrand48(...)
      - pattern: jrand48(...)
      - pattern: lcong48(...)
      - pattern: srand48(...)
      - pattern: seed48(...)
  # source: rules/c/insecure-api-scanf.yaml
  - id: raptor-insecure-api-scanf
    metadata:
      author: Marco Ivaldi <raptor@0xdeadbeef.info>
      category: security
      subcategory:
        - vuln
      vulnerability_class: Dangerous Method or Function
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
      technology:
        - c
        - cpp
      cwe:
        - "CWE-676: Use of Potentially Dangerous Function"
        - "CWE-120: Buffer Copy without Checking Size of Input ('Classic Buffer Overflow')"
        - "CWE-787: Out-of-bounds Write"
      owasp:
        - A10:2025 - Mishandling of Exceptional Conditions
      references:
        - https://g.co/kgs/PCHQjJ
    message: >-
      A buffer overflow condition exists when a program attempts to put
      more data in a buffer than it can hold, or when a program attempts to
      put data in a memory area outside of the boundaries of a buffer.
    severity: ERROR
    languages:
      - c
      - cpp
    patterns:
      - pattern-either:
          - pattern: scanf($FMT, ...)
          - pattern: __isoc99_scanf($FMT, ...)
          - pattern: vscanf($FMT, ...)
          - pattern: __isoc99_vscanf($FMT, ...)
          - pattern: fscanf($_, $FMT, ...)
          - pattern: __isoc99_fscanf($_, $FMT, ...)
          - pattern: vfscanf($_, $FMT, ...)
          - pattern: __isoc99_vfscanf($_, $FMT, ...)
          - pattern: sscanf($_, $FMT, ...)
          - pattern: __isoc99_sscanf($_, $FMT, ...)
          - pattern: vsscanf($_, $FMT, ...)
          - pattern: __isoc99_vsscanf($_, $FMT, ...)
          - pattern: wscanf($FMT, ...)
          - pattern: vwscanf($FMT, ...)
          - pattern: fwscanf($_, $FMT, ...)
          - pattern: vfwscanf($_, $FMT, ...)
          - pattern: swscanf($_, $FMT, ...)
          - pattern: vswscanf($_, $FMT, ...)
      # exclude string literals as source
      - pattern-not: sscanf("...", $FMT, ...)
      - pattern-not: __isoc99_sscanf("...", $FMT, ...)
      - pattern-not: vsscanf("...", $FMT, ...)
      - pattern-not: __isoc99_vsscanf("...", $FMT, ...)
      - pattern-not: swscanf("...", $FMT, ...)
      - pattern-not: vswscanf("...", $FMT, ...)
      - metavariable-regex:
          metavariable: $FMT
          # NOTE: some format string specifiers are not handled
          regex: '(".*%l?s.*"|".*%S.*"|[a-zA-Z_][a-zA-Z0-9_]*)'
