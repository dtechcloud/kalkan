  - id: raptor-ret-stack-address
    metadata:
      author: Marco Ivaldi <raptor@0xdeadbeef.info>
      category: security
      subcategory:
        - vuln
      vulnerability_class: Memory Issues
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      technology:
        - c
        - cpp
      cwe:
        - "CWE-562: Return of Stack Variable Address"
      owasp:
        - A06:2025 - Insecure Design
      references:
        - https://github.com/struct/mms
        - https://www.sei.cmu.edu/downloads/sei-cert-c-coding-standard-2016-v01.pdf
        - https://docs.microsoft.com/en-us/cpp/sanitizers/asan-error-examples
        - https://rules.sonarsource.com/c/type/Bug/RSPEC-946
    message: >-
      A function returns the address of a stack variable, which will cause
      unintended program behavior, typically in the form of a crash.
    severity: INFO
    languages:
      - c
      - cpp
    # NOTE: global variables declared outside functions and not explicitly tagged as static are not supported.
    # NOTE: multi-dimensional arrays and other ways to create an array are not covered.
    # NOTE: multiple pointer assignments and other ways to persist after function returns (e.g., output parameter) are not covered.
    # NOTE: a dedicated rule for C++ types/constructs should be implemented (see `cpp.lang.security.strings.return-c-str.return-c-str` and `cpp.lang.security.containers.std-return-data.std-return-data`).
    pattern-either:
      - patterns:
          - pattern: return $PTR;
          - pattern-either:
              # array
              - patterns:
                  - pattern-inside: |
                      $_ $PTR[$_];
                      ...
                  - pattern-not-inside: |
                      static $_ $PTR[$_];
                      ...
              - patterns:
                  - pattern-inside: |
                      $_ $PTR[$_] = ...;
                      ...
                  - pattern-not-inside: |
                      static $_ $PTR[$_] = ...;
                      ...
              - patterns:
                  - pattern-inside: |
                      $_ $PTR[] = ...;
                      ...
                  - pattern-not-inside: |
                      static $_ $PTR[] = ...;
                      ...
              # pointer to array
              - patterns:
                  - pattern-inside: |
                      $_ $ARR[$_];
                      ...
                      $PTR = $ARR;
                      ...
                  - pattern-not-inside: |
                      static $_ $ARR[$_];
                      ...
              - patterns:
                  - pattern-inside: |
                      $_ $ARR[$_] = ...;
                      ...
                      $PTR = $ARR;
                      ...
                  - pattern-not-inside: |
                      static $_ $ARR[$_] = ...;
                      ...
              - patterns:
                  - pattern-inside: |
                      $_ $ARR[] = ...;
                      ...
                      $PTR = $ARR;
                      ...
                  - pattern-not-inside: |
                      static $_ $ARR[] = ...;
                      ...
      - patterns:
          # address of local variable
          - pattern: return &$VAR;
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      $_ $VAR;
                      ...
                  - pattern-not-inside: |
                      static $_ $VAR;
                      ...
              - patterns:
                  - pattern-inside: |
                      $_ $VAR = ...;
                      ...
                  - pattern-not-inside: |
                      static $_ $VAR = ...;
                      ...
              - patterns:
                  - pattern-inside: |
                      $_ $VAR[$_];
                      ...
                  - pattern-not-inside: |
                      static $_ $VAR[$_];
                      ...
              - patterns:
                  - pattern-inside: |
                      $_ $VAR[$_] = ...;
                      ...
                  - pattern-not-inside: |
                      static $_ $VAR[$_] = ...;
                      ...
              - patterns:
                  - pattern-inside: |
                      $_ $VAR[] = ...;
                      ...
                  - pattern-not-inside: |
                      static $_ $VAR[] = ...;
                      ...
              - patterns:
                  - pattern-inside: |
                      $_ * $VAR;
                      ...
                  - pattern-not-inside: |
                      static $_ * $VAR;
                      ...
              - patterns:
                  - pattern-inside: |
                      $_ * $VAR = ...;
                      ...
                  - pattern-not-inside: |
                      static $_ * $VAR = ...;
                      ...
  # source: rules/c/suspicious-assert.yaml
  - id: raptor-suspicious-assert
    metadata:
      author: Marco Ivaldi <raptor@0xdeadbeef.info>
      category: security
      subcategory:
        - audit
      vulnerability_class: Other Security
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      technology:
        - c
        - cpp
      cwe:
        - "CWE-754: Improper Check for Unusual or Exceptional Conditions"
      owasp:
        - A10:2025 - Mishandling of Exceptional Conditions
      references:
        - https://legends2k.github.io/note/assert_vs_if/
        - https://github.com/struct/mms
    message: >-
      Most codebases define assertion macros which compile to a no-op on
      non-debug builds. If assertions are the only line of defense against
      untrusted input, the software may be exposed to attacks that leverage
      the lack of proper input checks.
    severity: WARNING
    languages:
      - c
      - cpp
    # NOTE: other conditions (i.e., equality and inequality) might be security-relevant as well.
    # NOTE: other kinds of assertion macros (e.g., `REQUIRE`, `DCHECK`, `ENSURE`, etc.) and custom wrappers are not covered.
    patterns:
      - pattern-either:
          - pattern: $ASSERT(..., <... $_ < $_ ...>, ...)
          - pattern: $ASSERT(..., <... $_ <= $_ ...>, ...)
          - pattern: $ASSERT(..., <... $_ > $_ ...>, ...)
          - pattern: $ASSERT(..., <... $_ >= $_ ...>, ...)
      - metavariable-regex:
          metavariable: $ASSERT
          regex: '(?i)^\w*assert\w*\s*$'
  # source: rules/c/unchecked-ret-malloc.yaml
  - id: raptor-unchecked-ret-malloc
    metadata:
      author: Marco Ivaldi <raptor@0xdeadbeef.info>
      category: security
      subcategory:
        - audit
      vulnerability_class: Memory Issues
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      technology:
        - c
        - cpp
      cwe:
        - "CWE-252: Unchecked Return Value"
        - "CWE-690: Unchecked Return Value to NULL Pointer Dereference"
      owasp:
        - A10:2025 - Mishandling of Exceptional Conditions
      references:
        - https://g.co/kgs/PCHQjJ
        - https://github.com/struct/mms
        - https://www.sei.cmu.edu/downloads/sei-cert-c-coding-standard-2016-v01.pdf
    message: >-
      The software does not check the return value from a method or
      function, which can prevent it from detecting unexpected states and
      conditions.
    severity: WARNING
    languages:
      - c
      - cpp
    # NOTE: custom wrappers are not covered.
    # NOTE: for another approach to NULL pointer dereferencing detection, refer to `cpp.lang.security.memory.null-deref.null-library-function.null-library-function`.
    patterns:
      - pattern-either:
          - pattern: $RET = $FUN(...)
      - metavariable-pattern:
          metavariable: $FUN
          pattern-either:
            - pattern: malloc
            - pattern: calloc
            - pattern: realloc
            - pattern: reallocf
            - pattern: valloc
            - pattern: aligned_alloc
            - pattern: strdup
            - pattern: strndup
      - pattern-not-inside: |
          $FUN(...);
          ...
          if (<... $RET ...>) ...
      # no need to explicitly check the following patterns, as the deep expression operator above will already match them
      # - pattern-not-inside: |
      #     $FUN(...);
      #     ...
      #     if (<... $RET == NULL ...>) ...
      # - pattern-not-inside: |
      #     $FUN(...);
      #     ...
      #     if (<... NULL == $RET ...>) ...
      # - pattern-not-inside: |
      #     $FUN(...);
      #     ...
      #     if (<... $RET != NULL ...>) ...
      # - pattern-not-inside: |
      #     $FUN(...);
      #     ...
      #     if (<... NULL != $RET ...>) ...
      # - pattern-not-inside: |
      #     $FUN(...);
      #     ...
      #     if (<... !$RET ...>) ...
      - pattern-not-inside: <... $_ == NULL ...>
      - pattern-not-inside: <... NULL == $_ ...>
      - pattern-not-inside: <... $_ != NULL ...>
      - pattern-not-inside: <... NULL != $_ ...>
      - pattern-not-inside: <... !$_ ...>
