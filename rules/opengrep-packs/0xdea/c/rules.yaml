  # source: rules/c/integer-wraparound.yaml
  - id: raptor-integer-wraparound
    metadata:
      author: Marco Ivaldi <raptor@0xdeadbeef.info>
      category: security
      subcategory:
        - vuln
      vulnerability_class: Memory Issues
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      technology:
        - c
        - cpp
      cwe:
        - "CWE-190: Integer Overflow or Wraparound"
        - "CWE-128: Wrap-around Error"
        - "CWE-131: Incorrect Calculation of Buffer Size"
      owasp:
        - A10:2025 - Mishandling of Exceptional Conditions
      references:
        - https://www.sei.cmu.edu/downloads/sei-cert-c-coding-standard-2016-v01.pdf
        - http://www.phrack.org/issues/60/10.html#article
        - https://docs.microsoft.com/en-us/cpp/sanitizers/asan-error-examples
        - https://dustri.org/b/playing-with-weggli.html
    message: >-
      The software performs a calculation that can produce an integer
      overflow or wraparound, when the logic assumes that the resulting
      value will always be larger than the original value. This can
      introduce other weaknesses when the calculation is used for resource
      management or execution control.
    severity: WARNING
    languages:
      - c
      - cpp
    # NOTE: only multiplication and sum with two operands are covered; other arithmetic operations should also be considered (e.g., left shift, even subtraction), as well as any operation with more than two operands.
    # NOTE: some allocation functions such as `kmalloc`, `HeapAlloc`, and custom wrappers are not covered.
    # NOTE: there might exist other buggy input validation patterns not covered here, including the same patterns with a different order of operands.
    # NOTE: consider excluding `strlen` patterns to avoid false positives (at the cost of some false negatives).
    # NOTE: we should do some tests with the deep expression operator, refer also to `cpp.lang.security.memory.integer-overflow-allocation.integer-overflow-allocation`.
    # NOTE: a dedicated rule for C++ operators such as `new` should be implemented.
    pattern-either:
      # malloc, valloc (multiplication)
      - patterns:
          - pattern-either:
              - pattern: $FUN($_ * $_)
              - pattern: $FUN($_ *= $_)
          - metavariable-pattern:
              metavariable: $FUN
              pattern-either:
                - pattern: malloc
                - pattern: valloc
      - patterns:
          - pattern: $FUN($N)
          - pattern-either:
              - pattern-inside: |
                  $N = $_ * $_;
                  ...
              - pattern-inside: |
                  $N *= $_;
                  ...
          - metavariable-pattern:
              metavariable: $FUN
              pattern-either:
                - pattern: malloc
                - pattern: valloc
      # malloc, valloc (sum)
      - patterns:
          - pattern-either:
              - pattern: $FUN($_ + $_)
              - pattern: $FUN($_ += $_)
          - metavariable-pattern:
              metavariable: $FUN
              pattern-either:
                - pattern: malloc
                - pattern: valloc
      - patterns:
          - pattern: $FUN($N)
          - pattern-either:
              - pattern-inside: |
                  $N = $_ + $_;
                  ...
              - pattern-inside: |
                  $N += $_;
                  ...
          - metavariable-pattern:
              metavariable: $FUN
              pattern-either:
                - pattern: malloc
                - pattern: valloc
      # calloc, realloc, reallocf, aligned_alloc, VirtualAlloc (multiplication)
      - patterns:
          - pattern-either:
              - pattern: $FUN($_, $_ * $_, ...)
              - pattern: $FUN($_, $_ *= $_, ...)
          - metavariable-pattern:
              metavariable: $FUN
              pattern-either:
                - pattern: calloc
                - pattern: realloc
                - pattern: reallocf
                - pattern: aligned_alloc
                - pattern: VirtualAlloc
      - patterns:
          - pattern: $FUN($_, $N, ...)
          - pattern-either:
              - pattern-inside: |
                  $N = $_ * $_;
                  ...
              - pattern-inside: |
                  $N *= $_;
                  ...
          - metavariable-pattern:
              metavariable: $FUN
              pattern-either:
                - pattern: calloc
                - pattern: realloc
                - pattern: reallocf
                - pattern: aligned_alloc
                - pattern: VirtualAlloc
      # calloc, realloc, reallocf, aligned_alloc, VirtualAlloc (sum)
      - patterns:
          - pattern-either:
              - pattern: $FUN($_, $_ + $_, ...)
              - pattern: $FUN($_, $_ += $_, ...)
          - metavariable-pattern:
              metavariable: $FUN
              pattern-either:
                - pattern: calloc
                - pattern: realloc
                - pattern: reallocf
                - pattern: aligned_alloc
                - pattern: VirtualAlloc
      - patterns:
          - pattern: $FUN($_, $N, ...)
          - pattern-either:
              - pattern-inside: |
                  $N = $_ + $_;
                  ...
              - pattern-inside: |
                  $N += $_;
                  ...
          - metavariable-pattern:
              metavariable: $FUN
              pattern-either:
                - pattern: calloc
                - pattern: realloc
                - pattern: reallocf
                - pattern: aligned_alloc
                - pattern: VirtualAlloc
      # calloc (multiplication in 1st arg)
      - patterns:
          - pattern-either:
              - pattern: $FUN($_ * $_, $_)
              - pattern: $FUN($_ *= $_, $_)
          - metavariable-pattern:
              metavariable: $FUN
              pattern-either:
                - pattern: calloc
      - patterns:
          - pattern: $FUN($N, $_)
          - pattern-either:
              - pattern-inside: |
                  $N = $_ * $_;
                  ...
              - pattern-inside: |
                  $N *= $_;
                  ...
          - metavariable-pattern:
              metavariable: $FUN
              pattern-either:
                - pattern: calloc
      # calloc (sum in 1st arg)
      - patterns:
          - pattern-either:
              - pattern: $FUN($_ + $_, $_)
              - pattern: $FUN($_ += $_, $_)
          - metavariable-pattern:
              metavariable: $FUN
              pattern-either:
                - pattern: calloc
      - patterns:
          - pattern: $FUN($N, $_)
          - pattern-either:
              - pattern-inside: |
                  $N = $_ + $_;
                  ...
              - pattern-inside: |
                  $N += $_;
                  ...
          - metavariable-pattern:
              metavariable: $FUN
              pattern-either:
                - pattern: calloc
      # buggy input validation (sum)
      # consider integer promotion (i.e., uint16_t are not vulnerable on 32-bit systems)
      - pattern: $X > $MAX || ($X + $_) > $MAX
      - pattern: $X >= $MAX || ($X + $_) > $MAX
      - pattern: $X > $MAX || ($X + $_) >= $MAX
      - pattern: $X >= $MAX || ($X + $_) >= $MAX
      - pattern: $X < $MAX && ($X + $_) < $MAX
      - pattern: $X <= $MAX && ($X + $_) < $MAX
      - pattern: $X < $MAX && ($X + $_) <= $MAX
      - pattern: $X <= $MAX && ($X + $_) <= $MAX
      # buggy input validation (multiplication)
      # consider integer promotion (i.e., uint16_t are not vulnerable on 32-bit systems)
      - pattern: $X > $MAX || ($X * $_) > $MAX
      - pattern: $X >= $MAX || ($X * $_) > $MAX
      - pattern: $X > $MAX || ($X * $_) >= $MAX
      - pattern: $X >= $MAX || ($X * $_) >= $MAX
      - pattern: $X < $MAX && ($X * $_) < $MAX
      - pattern: $X <= $MAX && ($X * $_) < $MAX
      - pattern: $X < $MAX && ($X * $_) <= $MAX
      - pattern: $X <= $MAX && ($X * $_) <= $MAX
  # source: rules/c/off-by-one.yaml
  - id: raptor-off-by-one
    metadata:
      author: Marco Ivaldi <raptor@0xdeadbeef.info>
      category: security
      subcategory:
        - vuln
      vulnerability_class: Memory Issues
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      technology:
        - c
        - cpp
      cwe:
        - "CWE-193: Off-by-one Error"
        - "CWE-787: Out-of-bounds Write"
      owasp:
        - A10:2025 - Mishandling of Exceptional Conditions
      references:
        - https://g.co/kgs/PCHQjJ
        - https://github.com/struct/mms
    message: >-
      The software calculates or uses an incorrect maximum or minimum value
      that is 1 more, or 1 less, than the correct value.
    severity: WARNING
    languages:
      - c
      - cpp
    # NOTE: C++ `new` operator and some heap allocation functions are not covered.
    # NOTE: some string and memory copy functions are not covered.
    # NOTE: `memcpy(dst + 1, p, len)` and similar scenarios are not covered.
    # NOTE: pattern `{$len=snprintf(_); malloc($len);}` is not covered.
    # NOTE: some other ways to create an array are not covered.
    # NOTE: refer also to `metavariable-comparison` to catch larger indexes as in https://github.com/parsiya/semgrep-hotspots/blob/main/cpp/arrays-out-of-bounds-access.yaml
    # NOTE: refer also to `cpp.lang.security.strings.alloc-strlen.alloc-strlen` and `cpp.lang.security.strings.missing-nul-cpp-string-memcpy.missing-nul-cpp-string-memcpy`.
    pattern-either:
      # array access
      - pattern: $BUF[sizeof($BUF)] = ...
      - patterns:
          - pattern: $BUF[$LEN] = ...
          - pattern-either:
              - pattern-inside: |
                  $_ $BUF[$LEN];
                  ...
              - pattern-inside: |
                  $_ $BUF[$LEN] = ...;
                  ...
      - patterns:
          - pattern: |
              *($BUF + $LEN) = ...
          - pattern-either:
              - pattern-inside: |
                  $_ $BUF[$LEN];
                  ...
              - pattern-inside: |
                  $_ $BUF[$LEN] = ...;
                  ...
      # two-dimentional array access
      - patterns:
          - pattern: $BUF[$X][$Y] = ...
          - pattern-either:
              - pattern-inside: |
                  $_ $BUF[$_][$Y];
                  ...
              - pattern-inside: |
                  $_ $BUF[$X][$_];
                  ...
        # - pattern: for (<... $I = $NUM ...>; <... $I <= $LEN ...>; <... $I++ ...>) ...
        # - pattern: for (<... $I = $NUM ...>; <... $I <= $LEN ...>; <... ++$I ...>) ...
      # suspicious loops
      # <... $I = 0 ...> is still not supported by Semgrep as of 2025-11-22
      # - pattern: for ($_ $I = $NUM; <... $I <= $LEN ...>; <... $I++ ...>) ...
      # - pattern: for ($_ $I = $NUM; <... $I <= $LEN ...>; <... ++$I ...>) ...
      # - pattern: while (<... $I <= $LEN ...>) ...
      # - pattern: do ... while (<... $I <= $LEN ...>);
      # strlen vs. sizeof
      - pattern: strlen($SRC) > sizeof($DST)
      - pattern: strlen($SRC) <= sizeof($DST)
      - pattern: sizeof($DST) < strlen($SRC)
      - pattern: sizeof($DST) >= strlen($SRC)
      # potential strncat misuse
      - patterns:
          - pattern: strncat($_, $_, $LEN)
          - metavariable-pattern:
              metavariable: $LEN
              patterns:
                - pattern-not: $_ - 1
      # out-of-bound indexing: strlen($STR) con be 0 leading to a -1 index
      - pattern: $STR[strlen($STR) - 1]
      - patterns:
          - pattern-inside: |
              $LEN = strlen($STR) - 1;
              ...
          - pattern: $STR[$LEN]
      - patterns:
          - pattern-inside: |
              $LEN = strlen($STR);
              ...
          - pattern: $STR[$LEN - 1]
      # no space allocated for NUL terminator
      - pattern: malloc(strlen($STR))
      - patterns:
          - pattern-inside: |
              $LEN = strlen($STR);
              ...
          - pattern: malloc($LEN)
  # source: rules/c/overlapping-source-destination.yaml
  - id: raptor-overlapping-source-destination
    metadata:
      author: Marco Ivaldi <raptor@0xdeadbeef.info>
      category: security
      subcategory:
        - vuln
      vulnerability_class: Memory Issues
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      technology:
        - c
        - cpp
      cwe:
        - "CWE-1260: Improper Handling of Overlap Between Protected Memory Ranges"
      owasp:
        - A10:2025 - Mishandling of Exceptional Conditions
      references:
        - https://linux.die.net/man/3/sprintf
    message: >-
      C standards specify that the results are undefined if a call to
      copy functions, with the exception of memmove(), would cause copying
      to take place between objects that overlap (e.g., if the target
      string array and one of the supplied input arguments refer to the
      same buffer).
    severity: WARNING
    languages:
      - c
      - cpp
    # NOTE: `vsprintf`, `vsnprintf`, `swprintf`, and `vswprintf` are not covered.
    # NOTE: `strcpy_s`, `strcat_s`, and similar variants are not covered.
    pattern-either:
      - patterns:
          - pattern: $FUN($DST, $DST, ...)
          - metavariable-pattern:
              metavariable: $FUN
              pattern-either:
                # strcpy
                - pattern: strcpy
                - pattern: strncpy
                - pattern: stpcpy
                - pattern: stpncpy
                - pattern: strlcpy
                - pattern: strscpy
                - pattern: wcscpy
                - pattern: wcsncpy
                - pattern: wcpcpy
                - pattern: wcpncpy
                - pattern: wcslcpy
                - pattern: _mbscpy
                - pattern: _mbsncpy
                - pattern: _mbpcpy
                - pattern: _mbpncpy
                - pattern: _mbslcpy
                - pattern: strccpy
                - pattern: strcadd
                - pattern: streadd
                - pattern: strecpy
                # strcat
                - pattern: strcat
                - pattern: strncat
                - pattern: strlcat
                - pattern: wcscat
                - pattern: wcsncat
                - pattern: wcslcat
                - pattern: _mbscat
                - pattern: _mbsncat
                - pattern: _mbslcat
                # memcpy
                - pattern: memcpy
                - pattern: memccpy
                - pattern: wmemcpy
                - pattern: mempcpy
                - pattern: wmempcpy
                # bcopy
                - pattern: bcopy
      # sprintf
      - pattern: sprintf($DST, ..., $DST, ...)
      - pattern: snprintf($DST, $_, ..., $DST, ...)
  # source: rules/c/pointer-subtraction.yaml
  - id: raptor-pointer-subtraction
    metadata:
      author: Marco Ivaldi <raptor@0xdeadbeef.info>
      category: security
      subcategory:
        - audit
      vulnerability_class: Memory Issues
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      technology:
        - c
        - cpp
      cwe:
        - "CWE-469: Use of Pointer Subtraction to Determine Size"
      owasp:
        - A10:2025 - Mishandling of Exceptional Conditions
      references:
        - https://github.com/struct/mms
    message: >-
      The software subtracts one pointer from another in order to determine
      size, but this calculation can be incorrect if the pointers do not
      exist in the same memory chunk.
    severity: WARNING
    languages:
      - c
      - cpp
    # NOTE: some types and combinations are missing; also, function calls are not covered.
    pattern-either:
      # type-based patterns
      - pattern: (char * $_) - (char * $_)
      - pattern: (int * $_) - (int * $_)
      - pattern: (float * $_) - (float * $_)
      - pattern: (double * $_) - (double * $_)
      # other patterns
      - patterns:
          - pattern-either:
              - pattern: $PTR1 - $PTR2
              - pattern: $PTR2 - $PTR1
          - pattern-either:
              - pattern-inside: |
                  $_ * $PTR1;
                  $_ * $PTR2;
                  ...
              - pattern-inside: |
                  $_ * $PTR1 = ...;
                  $_ * $PTR2 = ...;
                  ...
              - pattern-inside: |
                  $_ * $PTR1 = ...;
                  $_ * $PTR2;
                  ...
              - pattern-inside: |
                  $_ * $PTR1;
                  $_ * $PTR2 = ...;
                  ...
              - pattern-inside: |
                  $_ * $PTR3 = $PTR1;
                  $_ * $PTR2;
                  ...
              - pattern-inside: |
                  $_ * $PTR2;
                  $_ * $PTR3 = $PTR1;
                  ...
  # source: rules/c/putenv-stack-var.yaml
  - id: raptor-putenv-stack-var
    metadata:
      author: Marco Ivaldi <raptor@0xdeadbeef.info>
      category: security
      subcategory:
        - vuln
      vulnerability_class: Memory Issues
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      technology:
        - c
        - cpp
      cwe:
        - "CWE-686: Function Call With Incorrect Argument Type"
        - "CWE-562: Return of Stack Variable Address"
      owasp:
        - A06:2025 - Insecure Design
      references:
        - https://www.sei.cmu.edu/downloads/sei-cert-c-coding-standard-2016-v01.pdf
    message: >-
      The software calls putenv() with a variable that has a short lifetime,
      such as a pointer to an automatic variable allocated on the stack. The
      correct behavior is to call putenv() with a static/global string.
    severity: INFO
    languages:
      - c
      - cpp
    # NOTE: global variables declared outside functions and not explicitly tagged as static are not supported.
    # NOTE: multi-dimensional arrays and other ways to create an array are not covered.
    # NOTE: multiple pointer assignments and other ways to persist after function returns (e.g., output parameter) are not covered.
    patterns:
      - pattern: putenv($PTR)
      - pattern-either:
          # array
          - patterns:
              - pattern-inside: |
                  $_ $PTR[$_];
                  ...
              - pattern-not-inside: |
                  static $_ $PTR[$_];
                  ...
          - patterns:
              - pattern-inside: |
                  $_ $PTR[$_] = ...;
                  ...
              - pattern-not-inside: |
                  static $_ $PTR[$_] = ...;
                  ...
          - patterns:
              - pattern-inside: |
                  $_ $PTR[] = ...;
                  ...
              - pattern-not-inside: |
                  static $_ $PTR[] = ...;
                  ...
          # pointer to array
          - patterns:
              - pattern-inside: |
                  $_ $ARR[$_];
                  ...
                  $PTR = $ARR;
                  ...
              - pattern-not-inside: |
                  static $_ $ARR[$_];
                  ...
          - patterns:
              - pattern-inside: |
                  $_ $ARR[$_] = ...;
                  ...
                  $PTR = $ARR;
                  ...
              - pattern-not-inside: |
                  static $_ $ARR[$_] = ...;
                  ...
          - patterns:
              - pattern-inside: |
                  $_ $ARR[] = ...;
                  ...
                  $PTR = $ARR;
                  ...
              - pattern-not-inside: |
                  static $_ $ARR[] = ...;
                  ...
  # source: rules/c/regex-dos.yaml
  - id: raptor-regex-dos
    metadata:
      author: Marco Ivaldi <raptor@0xdeadbeef.info>
      category: security
      subcategory:
        - vuln
      vulnerability_class: Denial-of-Service (DoS)
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      technology:
        - c
        - cpp
      cwe:
        - "CWE-1333: Inefficient Regular Expression Complexity"
      owasp:
        - A10:2025 - Mishandling of Exceptional Conditions
      references:
        - https://semgrep.dev/docs/writing-rules/metavariable-analysis
        - https://github.com/semgrep/semgrep/pull/4672
    message: >-
      The software uses a regular expression with an inefficient, possibly
      exponential worst-case computational complexity that consumes excessive
      CPU cycles. Poorly constructed regular expressions that exhibit
      exponential runtime when fed specifically crafted inputs can cause RegEx
      denial of service (ReDoS).
    severity: WARNING
    languages:
      - c
      - cpp
    # NOTE: the C++ `std::regex` library is not covered.
    patterns:
      - pattern-either:
          - pattern: $FUN($_, $REGEX, $_)
          - pattern: |
              $STRING = $REGEX;
              ...
              <... $FUN($_, $STRING, $_) ...>;
      - metavariable-pattern:
          metavariable: $FUN
          pattern-either:
            - pattern: regcomp
            - pattern: regncomp
            - pattern: regwcomp
            - pattern: regwncomp
            - pattern: regcomp_l
            - pattern: regncomp_l
            - pattern: regwcomp_l
            - pattern: regwncomp_l
      - metavariable-analysis:
          analyzer: redos
          metavariable: $REGEX
      # improve output readability
      - focus-metavariable: $REGEX
