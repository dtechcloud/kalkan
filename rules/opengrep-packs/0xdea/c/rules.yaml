  # source: rules/c/unchecked-ret-setuid-seteuid.yaml
  - id: raptor-unchecked-ret-setuid-seteuid
    metadata:
      author: Marco Ivaldi <raptor@0xdeadbeef.info>
      category: security
      subcategory:
        - audit
      vulnerability_class: Improper Authorization
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      technology:
        - c
        - cpp
      cwe:
        - "CWE-252: Unchecked Return Value"
      owasp:
        - A10:2025 - Mishandling of Exceptional Conditions
      references:
        - https://lwn.net/Articles/451985/
        - https://www.usenix.org/legacy/events/sec02/full_papers/chen/chen.pdf
        - https://www.openwall.com/lists/oss-security/2023/12/30/4
    message: >-
      The software does not check the return value from a method or
      function, which can prevent it from detecting unexpected states and
      conditions. If the program calls a function to drop privileges but 
      does not check the return code to ensure that privileges were 
      successfully dropped, then the program will continue to operate with 
      the higher privileges.
    severity: WARNING
    languages:
      - c
      - cpp
    patterns:
      - pattern: $FUN(...)
      - metavariable-pattern:
          metavariable: $FUN
          pattern-either:
            - pattern: setuid
            - pattern: seteuid
      - pattern-not-inside: $_ = $FUN(...)
      - pattern-not-inside: <... $FUN(...) == $_ ...>
      - pattern-not-inside: <... $_ == $FUN(...) ...>
      - pattern-not-inside: <... $FUN(...) != $_ ...>
      - pattern-not-inside: <... $_ != $FUN(...) ...>
      - pattern-not-inside: <... $FUN(...) < $_ ...>
      - pattern-not-inside: <... $_ > $FUN(...) ...>
      - pattern-not-inside: <... !$FUN(...) ...>
      - pattern-not-inside: return $FUN(...);
  # source: rules/c/unsafe-ret-snprintf-vsnprintf.yaml
  - id: raptor-unsafe-ret-snprintf-vsnprintf
    metadata:
      author: Marco Ivaldi <raptor@0xdeadbeef.info>
      category: security
      subcategory:
        - audit
      vulnerability_class: Memory Issues
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      technology:
        - c
        - cpp
      cwe:
        - "CWE-131: Incorrect Calculation of Buffer Size"
      owasp:
        - A10:2025 - Mishandling of Exceptional Conditions
      references:
        - https://lwn.net/Articles/507319/
        - https://g.co/kgs/PCHQjJ
        - https://dustri.org/b/playing-with-weggli.html
    message: >-
      The snprintf() and vsnprintf() functions return the total length of
      the string they tried to create. Therefore, this return value can be
      larger than the size of the destination buffer. If it is used
      unsafely, e.g. as an index to write to the destination buffer, memory
      corruption might occur.
    severity: WARNING
    languages:
      - c
      - cpp
    # NOTE: for another approach that uses taint mode, refer to `cpp.lang.security.strings.snprintf-return-value-length.snprintf-return-value-length`.
    patterns:
      - pattern-either:
          - pattern: $_ = $FUN($_, $_, $FMT, ...)
          - pattern: $_ += $FUN($_, $_, $FMT, ...)
      - metavariable-pattern:
          metavariable: $FUN
          pattern-either:
            - pattern: snprintf
            - pattern: vsnprintf
            # swprintf and vswprintf return a negative value if n or more
            # widechars were requested to be written, thus behaving more safely
      - metavariable-regex:
          metavariable: $FMT
          # NOTE: some format string specifiers are not handled
          regex: '(".*%l?s.*"|".*%S.*"|[a-zA-Z_][a-zA-Z0-9_]*)'
  # source: rules/c/unsafe-ret-strlcpy-strlcat.yaml
  - id: raptor-unsafe-ret-strlcpy-strlcat
    metadata:
      author: Marco Ivaldi <raptor@0xdeadbeef.info>
      category: security
      subcategory:
        - audit
      vulnerability_class: Memory Issues
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      technology:
        - c
        - cpp
      cwe:
        - "CWE-131: Incorrect Calculation of Buffer Size"
      owasp:
        - A10:2025 - Mishandling of Exceptional Conditions
      references:
        - https://lwn.net/Articles/507319/
        - https://g.co/kgs/PCHQjJ
    message: >-
      The strlcpy() and strlcat() functions return the total length of the
      string they tried to create. For strlcpy() that means the length of
      the source string. For strlcat() that means the initial length of the
      destination string plus the length of of the source string.
      Therefore, this return value can be larger than the size of the
      destination buffer. If it is used unsafely, e.g. as an index to write
      to the destination buffer, memory corruption might occur.
    severity: WARNING
    languages:
      - c
      - cpp
    patterns:
      - pattern-either:
          - pattern: $_ = $FUN(...)
          - pattern: $_ += $FUN(...)
      - metavariable-pattern:
          metavariable: $FUN
          pattern-either:
            - pattern: strlcpy
            - pattern: strlcat
            - pattern: wcslcpy
            - pattern: wcslcat
            - pattern: _mbslcpy
            - pattern: _mbslcat
  # source: rules/c/unsafe-strlen.yaml
  - id: raptor-unsafe-strlen
    metadata:
      author: Marco Ivaldi <raptor@0xdeadbeef.info>
      category: security
      subcategory:
        - vuln
      vulnerability_class: Other Security
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      technology:
        - c
        - cpp
      cwe:
        - "CWE-190: Integer Overflow or Wraparound"
      owasp:
        - A10:2025 - Mishandling of Exceptional Conditions
      references:
        - https://github.com/struct/mms
    message: >-
      The software performs a calculation that can produce an integer
      overflow or wraparound, when the logic assumes that the resulting
      value will always be larger than the original value. This can
      introduce other weaknesses when the calculation is used for resource
      management or execution control. When influenced by the size of an 
      input it is often easier to overflow a short than an int.
    severity: WARNING
    languages:
      - c
      - cpp
    patterns:
      - pattern-either:
          # signed and unsigned short
          - pattern: (short $_) = $FUN(...)
          - pattern: (short int $_) = $FUN(...)
          - pattern: (unsigned short $_) = $FUN(...)
          - pattern: (unsigned short int $_) = $FUN(...)
        # signed int
        # - pattern: (int $LEN) = $FUN(...);
      - metavariable-pattern:
          metavariable: $FUN
          pattern-either:
            - pattern: strlen
            - pattern: lstrlen
            - pattern: strnlen
            - pattern: wcslen
            - pattern: wcsnlen
              # - pattern: _mbslen
              # - pattern: _mbstrlen
              # - pattern: _mbsnlen
              # - pattern: _mbstrnlen
