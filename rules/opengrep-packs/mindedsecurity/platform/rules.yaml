    message: Identified a potential SQL Injection vulnerability during intent handling.
    options:
      symbolic_propagation: true
    mode: taint
    pattern-sources:
      - patterns:
        - pattern-either:
            - pattern: getIntent().$GETMETHOD(...)
            - pattern: ... .getIntent().$GETMETHOD(...)
        - metavariable-regex:
            metavariable: $GETMETHOD
            regex: get.*
      - patterns:
        - pattern-inside: class $CLASS extends BroadcastReceiver { ... }
        - pattern-inside: $M(..., Intent $I, ...) { ... }
        - patterns:
          - pattern: $I.$GETMETHOD(...)
          - metavariable-regex:
              metavariable: $GETMETHOD
              regex: get.*
      - patterns:
        - pattern-inside: void onNewIntent(Intent $I){ ... }
        - patterns:
          - pattern: $I.$GETMETHOD(...)
          - metavariable-regex:
              metavariable: $GETMETHOD
              regex: get.*
      - patterns:
        - pattern-inside: int onStartCommand(Intent $I, ...){ ... }
        - patterns:
          - pattern: $I.$GETMETHOD(...)
          - metavariable-regex:
              metavariable: $GETMETHOD
              regex: get.*
      - patterns:
        - pattern-inside: void onReceive(..., Intent $I){ ... }
        - patterns:
          - pattern: $I.$GETMETHOD(...)
          - metavariable-regex:
              metavariable: $GETMETHOD
              regex: get.*      

