  - id: android_kotlin_webview_ignore_ssl
    patterns:
      - pattern-either:
          - pattern: |
              override fun onReceivedSslError($W: WebView, $H: SslErrorHandler, $E: SslError) {
                ...
                $H.proceed()
                ...
              }
          - pattern: |
              fun onReceivedSslError($W: WebView, $H: SslErrorHandler, $E: SslError) {
                ...
                $H.proceed()
                ...
              }
    message: >-
      Insecure WebView Implementation. WebView ignores SSL Certificate errors and
