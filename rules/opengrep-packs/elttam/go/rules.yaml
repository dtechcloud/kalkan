  # source: rules-audit/go/gorilla/security/audit/gorilla-cookiestore-default-samesite-none.yaml
  - id: gorilla-cookiestore-default-samesite-none
    message: >-
      gorilla/sessions.NewCookieStore (and NewFilesystemStore) initialise
      Options.SameSite to http.SameSiteNoneMode by default, which allows the
      session cookie to be sent on cross-site requests and removes a key CSRF
      defence. The existing session-cookie-samesitenone rule only catches an
      explicit &sessions.Options{SameSite: http.SameSiteNoneMode}; this insecure
      value is also the silent default when you never set Options at all.
      After NewCookieStore, explicitly set store.Options.SameSite to
      http.SameSiteLaxMode or http.SameSiteStrictMode.
    languages: [go]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: $STORE := sessions.NewCookieStore(...)
          - pattern: $STORE = sessions.NewCookieStore(...)
          - pattern: $STORE := sessions.NewFilesystemStore(...)
          - pattern: $STORE = sessions.NewFilesystemStore(...)
      # the store's SameSite is never overridden afterwards
      - pattern-not-inside: |
          $STORE := sessions.NewCookieStore(...)
          ...
          $STORE.Options.SameSite = $V
      - pattern-not-inside: |
          $STORE = sessions.NewCookieStore(...)
          ...
          $STORE.Options.SameSite = $V
      - pattern-not-inside: |
          $STORE := sessions.NewCookieStore(...)
          ...
          $STORE.Options = $OPTS
      - pattern-not-inside: |
          $STORE := sessions.NewFilesystemStore(...)
          ...
          $STORE.Options.SameSite = $V
      - pattern-not-inside: |
          $STORE := sessions.NewFilesystemStore(...)
          ...
          $STORE.Options = $OPTS
    metadata:
      cwe:
        - "CWE-1275: Sensitive Cookie with Improper SameSite Attribute"
      owasp:
        - A05:2021 - Security Misconfiguration
        - A02:2025 - Security Misconfiguration
      category: security
      subcategory:
        - audit
      confidence: LOW
      likelihood: LOW
      impact: MEDIUM
      technology:
        - gorilla
      references:
        - https://github.com/gorilla/sessions/blob/v1.4.0/store.go#L59
      # v2: logic unchanged. 0 hits across 34 scanned projects because none call
      # sessions.NewCookieStore in-tree; validate against code-search-sourced
      # consumers (application code, not libraries) rather than flagship repos.
  # source: rules-audit/go/lang/security/audit/json-decode-without-content-type-check.yaml
  - id: json-decode-without-content-type-check
    message: >-
      An HTTP handler decodes the request body as JSON without validating the
      Content-Type header. Browsers send no CORS preflight for "simple" requests
      using text/plain or application/x-www-form-urlencoded, so a cross-site HTML
      form can POST a body the server parses as JSON (encoding/json also ignores
      trailing bytes, so a form's trailing "=" doesn't break parsing). With cookie
      auth this is exploitable as CSRF. Reject requests whose Content-Type is not
      application/json, and/or wrap handlers with http.CrossOriginProtection
      (Go 1.25+).

      v2: handler matching widened to cover method receivers, extra parameters
      (e.g. ctx), and common framework handler signatures (gin, echo, chi/std) —
      the std-only two-arg pattern missed real handlers like
      func (h *T) handleWrite(w, r, ctx) found in production code.
    languages: [go]
    severity: WARNING
    patterns:
      # the body is decoded as JSON from the request
      - pattern-either:
          - pattern: json.NewDecoder($R.Body).Decode($X)
          - patterns:
              - pattern: $DEC.Decode($X)
              - pattern-inside: |
                  $DEC := json.NewDecoder($R.Body)
                  ...
          - patterns:
              - pattern: $DEC.Decode($X)
              - pattern-inside: |
                  $DEC := json.NewDecoder($C.Request().Body)
                  ...
          - pattern: json.NewDecoder($C.Request().Body).Decode($X)
      # inside some handler-shaped function (std, method, extra params, or framework)
      - pattern-either:
          - pattern-inside: |
              func $H(..., $W http.ResponseWriter, $R *http.Request, ...) { ... }
          - pattern-inside: |
              func ($RT) $H(..., $W http.ResponseWriter, $R *http.Request, ...) { ... }
          - pattern-inside: |
              func $H($C echo.Context) error { ... }
          - pattern-inside: |
              func ($RT) $H($C echo.Context) error { ... }
          - pattern-inside: |
              func $H($C *gin.Context) { ... }
          - pattern-inside: |
              func ($RT) $H($C *gin.Context) { ... }
      # no Content-Type validation anywhere in the enclosing function
      - pattern-not-inside: |
          func $H(...) {
            ...
            $R.Header.Get("Content-Type")
            ...
          }
      - pattern-not-inside: |
          func ($RT) $H(...) {
            ...
            $R.Header.Get("Content-Type")
            ...
          }
      - pattern-not-inside: |
          func $H(...) $RET {
            ...
            $R.Header.Get("Content-Type")
            ...
          }
      - pattern-not-inside: |
          func ($RT) $H(...) $RET {
            ...
            $R.Header.Get("Content-Type")
            ...
          }
      - pattern-not-inside: |
          func $H(...) $RET {
            ...
            $R.Header.Values("Content-Type")
            ...
          }
      - pattern-not-inside: |
          func $H(...) $RET {
            ...
            $C.Request().Header.Get("Content-Type")
            ...
          }
      - pattern-not-inside: |
          func $H(...) $RET {
            ...
            $C.GetHeader("Content-Type")
            ...
          }
      - pattern-not-inside: |
          func $H(...) $RET {
            ...
            $C.ContentType()
            ...
          }
      - pattern-not-inside: |
          func $H(...) $RET {
            ...
            $C.Bind($Y)
            ...
          }
    metadata:
      cwe:
        - "CWE-352: Cross-Site Request Forgery (CSRF)"
      owasp:
        - A01:2021 - Broken Access Control
      category: security
      subcategory:
        - audit
      confidence: LOW
      likelihood: LOW
      impact: MEDIUM
      technology:
        - go
        - net/http
      references:
        - https://pkg.go.dev/net/http#CrossOriginProtection
        - https://pkg.go.dev/encoding/json#Decoder.Decode
  # source: rules-audit/go/lang/security/audit/len-cast-to-narrow-int-overflow.yaml
  # ---- broad audit rule (unchanged logic; INFO so it doesn't dominate CI) ----
  - id: len-cast-to-narrow-int-overflow
    message: >-
      The result of len() is cast to a narrower fixed-width integer
      (uint32/int32/uint16/int16/uint8/int8). len() returns int (64-bit on
      amd64/arm64), so a length above the target type's max silently wraps. This
      is benign for in-memory counts/sizes but dangerous when the value becomes a
      length/size field in a binary or wire format, where a truncated length
      desynchronises the parser from the payload (data smuggling / boundary
      confusion). Validate the length before casting, or keep the full-width value
      and reject oversized input.

      NOTE: this broad rule fires on every narrowing len() cast and is INFO/audit.
      For the dangerous subset, see len-cast-into-binary-length-prefix below.
    languages: [go]
    severity: INFO
    patterns:
      - pattern-either:
          - pattern: uint32(len($X))
          - pattern: int32(len($X))
          - pattern: uint16(len($X))
          - pattern: int16(len($X))
          - pattern: uint8(len($X))
          - pattern: int8(len($X))
      - pattern-not-inside: |
          if len($X) > $MAX { ... }
          ...
      - pattern-not-inside: |
          if len($X) <= $MAX { ... }
          ...
      - pattern-not-inside: |
          if len($X) >= $MAX { ... }
          ...
      - pattern-not-inside: |
          if $LEN := len($X); $LEN > $MAX { ... }
          ...
    metadata:
      cwe:
        - "CWE-190: Integer Overflow or Wraparound"
      owasp:
        - A03:2021 - Injection
      category: security
      subcategory: [audit]
      confidence: LOW
      likelihood: LOW
      impact: MEDIUM
      technology: [go]
      references:
        - https://github.com/tinylib/msgp/blob/v1.5.0/msgp/write.go
        - https://blog.trailofbits.com/2025/12/31/detect-gos-silent-arithmetic-bugs-with-go-panikint/
  # ---- high-signal companion: cast feeds a binary length prefix ----
  - id: len-cast-into-binary-length-prefix
    message: >-
      A narrowing cast of len() is written as a binary length prefix via
      encoding/binary, then the corresponding payload is emitted. This is the
      exploitable shape from the msgp/DEF CON 32 class: if the length exceeds the
      narrow type's max it wraps, the on-wire length field desynchronises from the
      actual payload, and a downstream parser can be smuggled extra/short data.
      Bound the length against the type max (or the protocol limit) before writing
      it, and reject oversized payloads.
    languages: [go]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: binary.$ORDER.PutUint32($BUF, uint32(len($X)))
          - pattern: binary.$ORDER.PutUint16($BUF, uint16(len($X)))
          - pattern: binary.Write($W, $ORDER, uint32(len($X)))
          - pattern: binary.Write($W, $ORDER, uint16(len($X)))
      - pattern-not-inside: |
          if len($X) > $MAX { ... }
          ...
      - pattern-not-inside: |
          if len($X) <= $MAX { ... }
          ...
      - pattern-not-inside: |
          if len($X) >= $MAX { ... }
          ...
    metadata:
      cwe:
        - "CWE-190: Integer Overflow or Wraparound"
      owasp:
        - A03:2021 - Injection
      category: security
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: LOW
      impact: HIGH
      technology: [go]
      references:
        - https://media.defcon.org/DEF%20CON%2032/DEF%20CON%2032%20presentations/
        - https://github.com/tinylib/msgp/blob/v1.5.0/msgp/write.go
      # v2: split out from the broad rule. Real-code runs showed every genuine
      # bug-shape (moby stdcopy, k8s framer, minio s3select/grid, caddy fastcgi)
      # writes the cast as a binary length prefix; the ~100 benign hits were
      # in-memory counts that never reach encoding/binary.
  # source: rules-audit/go/orm-leak/beego-orm.yaml
  #
  # =============================================================================
  # TAINT: request input -> Beego ORM query expression sinks
  #
  # Rationale:
  # - Beego query expressions support relational traversal with "__" and operators
  #   like contains/startswith/gt/etc.
  # - If user input controls the *expression string* (field path / operator),
  #   it can enable ORM leak-style inference.
  # =============================================================================
  #
  - id: beego-ormleak-taint-dynamic-expr
    message: >-
      User-controlled input flows into Beego ORM query expression (Filter/Exclude/Condition.*).
      Beego expressions support "__" traversal and operators (e.g. "__contains", "__gt"),
      so attacker-controlled expressions can enable ORM leak-style inference.
    severity: WARNING
    metadata:
      cwe:
        - 'CWE-203: Observable Discrepancy'
      owasp:
        - A01:2021 - Broken Access Control
      references:
        - https://cwe.mitre.org/data/definitions/203.html
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
        - https://www.elttam.com/blog/leaking-more-than-you-joined-for/
      category: security
      technology:
        - golang
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
    languages: [go]
    mode: taint

    pattern-sources:
      # Beego Controller Get* APIs read query/form inputs
      - pattern: $CTX.Input.Query(...)
      - pattern: $C.GetString(...)
      - pattern: $C.GetStrings(...)
      - pattern: $C.GetInt(...)
      - pattern: $C.GetInt64(...)
      - pattern: $C.GetBool(...)
      - pattern: $C.GetFloat(...)

      # Beego bind APIs (input -> struct)
      - pattern: $C.BindJSON(...)
      - pattern: $C.Bind(...)
      - pattern: $C.BindForm(...)
      - pattern: $C.BindXML(...)
      - pattern: $C.BindYAML(...)

      # Context Bind variants
      - pattern: $CTX.Input.Bind(...)
      - pattern: $C.Ctx.Input.Bind(...)

    pattern-sinks:
      - pattern-either:
          # QuerySeter expression APIs
          - pattern: $QS.Filter($EXPR, ...)
          - pattern: $QS.Exclude($EXPR, ...)
          - pattern: $QS.OrderBy($EXPR, ...)
          - pattern: $QS.GroupBy($EXPR, ...)

          # Condition expression APIs (not exhaustive but covers the common ones)
          - pattern: $COND.And($EXPR, ...)
          - pattern: $COND.Or($EXPR, ...)
          - pattern: $COND.AndNot($EXPR, ...)
          - pattern: $COND.OrNot($EXPR, ...)
          - pattern: $COND.Raw($EXPR, ...)
  - id: beego-ormleak-filterraw
    message: >-
      Beego ORM FilterRaw used. Docs warn it treats input directly as a query condition
      and Beego performs no checks. Review carefully (can enable injection or leak oracles).
    severity: WARNING
    metadata:
      cwe:
        - 'CWE-203: Observable Discrepancy'
      owasp:
        - A01:2021 - Broken Access Control
      references:
        - https://cwe.mitre.org/data/definitions/203.html
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
        - https://www.elttam.com/blog/leaking-more-than-you-joined-for/
      category: security
      technology:
        - golang
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
    languages: [go]
    pattern: $QS.FilterRaw($RAW, ...)
  # source: rules/go/lang/security/audit/uintptr-nonatomic.yaml
  - id: non-atomic-use-of-converted-uintptr
    message: >-
      An unsafe.Pointer converted to an uintptr must be used in an atomic step.
      Without this it is not guaranteed that the memory location uintptr points to will contain the intended structure.
    metadata:
      category: security
      subcategory: vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      technology:
        - golang
    severity: WARNING
    languages: [go]
    pattern-either:
      - pattern: |
          $UINTPTR := uintptr(unsafe.Pointer( ... ))
          ...
          ... :=  $F(..., $UINTPTR, ...)
      - pattern: |
          $UINTPTR := uintptr($PTR)
          ...
          ... := $F(..., $UINTPTR, ...)
