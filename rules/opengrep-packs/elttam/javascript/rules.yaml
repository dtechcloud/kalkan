  # source: rules-audit/javascript/express/security/audit/mongodb-nosqli.yml
  - id: express-mongodb-nosqli
    message: Depending on the context, using (user-controlled) request data directly in a MongoDB query can lead to a NoSQLi
      vulnerability.
    metadata:
      cwe:
        - 'CWE-20: Improper Input Validation'
      owasp:
        - A03:2021 – Injection
      references:
        - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/05.6-Testing_for_NoSQL_Injection
      category: security
      technology:
        - javascript
      subcategory: vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      interfile: true
    languages:
      # nosemgrep: yaml.semgrep.consistency.lang-consistency-js.lang-consistency-js
      - javascript
      # nosemgrep: yaml.semgrep.consistency.lang-consistency-ts.lang-consistency-ts
      - typescript
    severity: WARNING
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: function($REQ, ...) { ... }
          - pattern-either:
              - pattern: $REQ.$USERDATA
              - pattern: let { $USERDATA } = $REQ
          - focus-metavariable: $REQ
          - metavariable-regex:
              metavariable: $REQ
              regex: req
          - metavariable-regex:
              metavariable: $USERDATA
              regex: (body|params|query|cookies|headers)
    pattern-sanitizers:
      - patterns:
          - pattern: $X.toString()
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-inside: |
              $MODEL = require('$IMPORT')
              ...
          - metavariable-regex:
              metavariable: $IMPORT
              regex: .*(db|models|data|schema|mongo).*
          - pattern-either:
              - pattern: new $MODEL(...)
              - patterns:
                  - pattern: $MODEL.$FUNC(...)
                  - metavariable-regex:
                      metavariable: $FUNC
                      regex: (find|delete|update|replace|where|create|insert|map|bulk|aggregate|count).*
  # source: rules-audit/javascript/orm-leak/prisma-orm.yaml
  - id: prisma-ormleak-taint-where
    message: >-
      User-controlled data flows into Prisma `where`. If attackers can influence
      nested relations/operators (contains/startsWith/etc), this can enable ORM
      leak-style data inference.
    severity: WARNING
    metadata:
      cwe:
        - 'CWE-203: Observable Discrepancy'
      owasp:
        - A01:2021 - Broken Access Control
      references:
        - https://cwe.mitre.org/data/definitions/203.html
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
        - https://www.elttam.com/blog/plorming-your-primsa-orm/
      category: security
      technology:
        - javascript
        - typescript
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
    languages: [javascript, typescript]
    mode: taint

    pattern-sources:
      # Express / Fastify / Nest / Koa (common)
      - pattern: $REQ.query
      - pattern: $REQ.body
      - pattern: $REQ.params
      - pattern: $CTX.request.body
      - pattern: $CTX.query
      - pattern: $CTX.params

      # Fetch/Next/Workers style JSON body
      - pattern: await $REQ.json()
      - pattern: await $REQUEST.json()
      - pattern: await $EVENT.request.json()

      # Lambda/APIGW style
      - pattern: JSON.parse($EVENT.body)
      - pattern: JSON.parse($INPUT.body)

      # URLSearchParams (common in fetch handlers)
      - pattern: new URL($REQ.url).searchParams
      - pattern: new URL($REQUEST.url).searchParams

    pattern-sinks:
      - patterns:
          - pattern: '$P.$M.$FUNC({ ..., where: $WHERE, ... })'
          - metavariable-regex:
              metavariable: $FUNC
              regex: ^(find.*)
  - id: prisma-orm-operator-injection
    message: >-
      User-controlled data flows into Prisma `where` option for a field. If
      attackers can influence coerce the input type into an object, then they
      could inject Prisma operators. If the Prisma query is used during an
      authentication flow, it could result in an authentication bypass. Ensure
      input type validation checks are performed or the equals operator is
      explicitly used.
    severity: INFO
    metadata:
      cwe:
        - 'CWE-203: Observable Discrepancy'
      owasp:
        - A01:2021 - Broken Access Control
      references:
        - https://cwe.mitre.org/data/definitions/203.html
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
        - https://www.elttam.com/blog/plorming-your-primsa-orm/
      category: security
      technology:
        - javascript
        - typescript
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
    languages:
      - javascript
      - typescript
    mode: taint
    pattern-sources:
      - pattern: $REQ.query
      - pattern: $REQ.body
      - pattern: $REQ.params
      - pattern: $CTX.request.body
      - pattern: $CTX.query
      - pattern: $CTX.params
      - pattern: await $REQ.json()
      - pattern: await $REQUEST.json()
      - pattern: await $EVENT.request.json()
      - pattern: JSON.parse($EVENT.body)
      - pattern: JSON.parse($INPUT.body)
      - pattern: new URL($REQ.url).searchParams
      - pattern: new URL($REQUEST.url).searchParams
    pattern-sinks:
      - patterns:
          - pattern: '$P.$M.$FUNC({ ..., where: {..., $COL: ... , ...}, ... })'
          - metavariable-regex:
              metavariable: $FUNC
              regex: ^(find.*)
  - id: prisma-ormleak-taint-projection
