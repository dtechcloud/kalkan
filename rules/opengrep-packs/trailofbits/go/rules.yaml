  # source: go/servercodec-readrequestbody-unhandled-nil.yaml
  - id: servercodec-readrequestbody-unhandled-nil
    message: >-
      The `func ($O *$CODEC) ReadRequestBody($ARG $TYPE) error` function does not handle `nil` argument, as the `ServerCodec` interface requires.
      An incorrect implementation could lead to denial of service
    languages: [go]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-476: NULL Pointer Dereference"
      subcategory: [vuln]
      confidence: HIGH
      likelihood: MEDIUM
      impact: LOW
      technology: [--no-technology--]
      description: "Possible incorrect `ServerCodec` interface implementation"
      references:
        - https://github.com/golang/go/blob/go1.15.2/src/net/rpc/server.go#L643-L658

    patterns:
      - pattern: |
          func ($O *$CODEC) ReadRequestBody($ARG $TYPE) error {
            ...
          }
      - pattern-not: |
          func ($O *$CODEC) ReadRequestBody($ARG $TYPE) error {
            ...
            if $ARG == nil { ... }
            ...
          }
      - pattern-not: |
          func ($O *$CODEC) ReadRequestBody($ARG $TYPE) error {
            ...
            if $ARG != nil { ... }
            ...
          }
  # source: go/string-to-int-signedness-cast.yaml
  - id: string-to-int-signedness-cast
    message: Downcasting or changing sign of an integer with `$CAST_METHOD` method
    languages: [go]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-681: Incorrect Conversion between Numeric Types"
      subcategory: [audit]
      confidence: HIGH
      likelihood: LOW
      impact: MEDIUM
      technology: [--no-technology--]
      description: "Integer underflows"
      references:
        - https://github.com/golang/go/issues/30209

    pattern-either:
      # 64 -> lower or sign
      - patterns:
          - metavariable-pattern:
              metavariable: $CAST_METHOD
              pattern-either:
                - pattern: uint8
                - pattern: uint16
                - pattern: uint32
                - pattern: int8
                - pattern: int16
                - pattern: int32

          - pattern-either:
              - pattern: |
                  $X, ... = strconv.Atoi(...)
                  ...
                  $CAST_METHOD($X)

              - pattern: |
                  $X, ... = strconv.ParseInt(..., ..., 64)
                  ...
                  $CAST_METHOD($X)

              - pattern: |
                  $X, ... = strconv.ParseUint(..., ..., 64)
                  ...
                  $CAST_METHOD($X)

      # assume int has 64 bits
      - pattern: |
          $X, ... = strconv.Atoi(...)
          ...
          uint64($X)

      - pattern: |
          $X, ... = strconv.ParseInt(..., ..., 64)
          ...
          uint64($X)

      - pattern: |
          $X, ... = strconv.ParseUint(..., ..., 64)
          ...
          int64($X)

      # 32 -> lower or sign
      - patterns:
          - metavariable-pattern:
              metavariable: $CAST_METHOD
              pattern-either:
                - pattern: uint8
                - pattern: uint16
                - pattern: int8
                - pattern: int16

          - pattern-either:
              - pattern: |
                  $X, ... = strconv.ParseInt(..., ..., 32)
                  ...
                  $CAST_METHOD($X)

              - pattern: |
                  $X, ... = strconv.ParseUint(..., ..., 32)
                  ...
                  $CAST_METHOD($X)

      - pattern: |
          $X, ... = strconv.ParseInt(..., ..., 32)
          ...
          uint32($X)

      - pattern: |
          $X, ... = strconv.ParseUint(..., ..., 32)
          ...
          int32($X)

      # 16 -> lower or sign
      - patterns:
          - metavariable-pattern:
              metavariable: $CAST_METHOD
              pattern-either:
                - pattern: uint8
                - pattern: int8

          - pattern-either:
              - pattern: |
                  $X, ... = strconv.ParseInt(..., ..., 16)
                  ...
                  $CAST_METHOD($X)

              - pattern: |
                  $X, ... = strconv.ParseUint(..., ..., 16)
                  ...
                  $CAST_METHOD($X)

      - pattern: |
          $X, ... = strconv.ParseInt(..., ..., 16)
          ...
          uint16($X)

      - pattern: |
          $X, ... = strconv.ParseUint(..., ..., 16)
          ...
          int16($X)

      # 8 -> sign
      - pattern: |
          $X, ... = strconv.ParseInt(..., ..., 8)
          ...
          uint8($X)

      - pattern: |
          $X, ... = strconv.ParseUint(..., ..., 8)
          ...
          int8($X)
  # source: go/sync-mutex-value-copied.yaml
  - id: sync-mutex-value-copied
    message: >-
      A `sync.Mutex` is copied in function `$FUNC` given that `$T` is value receiver. 
      As a result, the struct `$T` may not be locked as intended
    languages: [go]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-688: Function Call With Incorrect Variable or Reference as Argument"
      subcategory: [vuln]
      confidence: HIGH
      likelihood: HIGH
      impact: LOW
      technology: [--no-technology--]
      description: "Copying of `sync.Mutex` via value receivers"
      references:
        - https://go101.org/article/concurrent-common-mistakes.html

    patterns:
      - pattern-either:
          - pattern: |
              func ($T $TYPE) $FUNC(...){
                ...
                $T.Lock()
                ...
              }
          - pattern: |
              func ($T $TYPE) $FUNC(...){
                ...
                $T.RLock()
                ...
              }
      - pattern-not: |
          func ($T2 *$TYPE2) $FUNC(...){
            ...
          }
  # source: go/unmarshal_tag_is_dash.yaml
  - id: unmarshal-tag-is-dash
    message: >-
      Struct field can be decoded with the `-` key because the JSON tag starts with a `-` but is followed by a comma.
    languages: [go]
    severity: WARNING
    metadata:
      cwe: "CWE-172: Encoding Error"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [--no-technology--]
      references:
        - https://blog.trailofbits.com/
    patterns:
      - pattern: |
          type $T1 struct {
            ...
            $X $T2 `$TAG`
            ...
          }
      - focus-metavariable: $TAG
      - metavariable-regex:
          metavariable: $TAG
          regex: >-
            .*(json|yaml|xml):"-,[^"]*"
