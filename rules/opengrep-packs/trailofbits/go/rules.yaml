  - id: hanging-goroutine
    message: >-
      Potential goroutine leak due to unbuffered channel send inside loop or unbuffered channel receive in select block
    languages: [go]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-833: Deadlock"
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: LOW
      technology: [--no-technology--]
      description: "Goroutine leaks"
      references:
        - https://blog.trailofbits.com/2021/11/08/discovering-goroutine-leaks-with-semgrep

    patterns:
      - pattern-either:
          - pattern: |
              for ... {
                ...
                go func(...) {
                  ...
                  $CHANNEL <- $VAL
                  ...
                }(...)
              }
              ...
              $Y = <- $CHANNEL
              ...
          - pattern: |
              for ... {
                ...
                go func(...) {
                  ...
                  $CHANNEL <- $VAL
                  ...
                }(...)
              }
              ...
              return <- $CHANNEL
          - pattern: |
              for ... {
                ...
                go func(...) {
                  ...
                  select {
                    case ...
                    case $CHANNEL <- $VAL: ...
                    case ...
                  }
                  ...
                }(...)
              ...
              }
              ...
              return <- $CHANNEL
          - pattern: |
              go func(...){
                ...
                $CHANNEL <- $X
                ...
              }(...)
              ...
              select {
              case ...
              case $Y = <- $CHANNEL: 
              ...
              }
          - pattern: |
              go func(...){
                ...
                $CHANNEL <- $X
                ...
              }(...)
              ...
              select {
              case ...
              case <- $CHANNEL: 
              ...
              }
          - pattern: |
              go func(...){
                ...
                $CHANNEL <- $X
                ...
              }(...)
              ...
              select {
              case ...
              case $Y <- $CHANNEL: 
              ...
              }
      - pattern-inside: |
          $CHANNEL := make(...)
          ...
      - pattern-not-inside: |
          $CHANNEL := make(..., $T)
          ...

      # heuristics to limit FPs, we may miss some leaks because of these
      - pattern-not: |
          go func(...){
            ...
            $CHANNEL <- $X
            ...
          }(...)
          ...
          select {
          case ...
          case ...: 
            ...
            ... = <- $CHANNEL
            ...
          }
      - pattern-not: |
          go func(...){
            ...
            $CHANNEL <- $X
            ...
          }(...)
          ...
          select {
          case ...
          case ...: 
            ...
            <-$CHANNEL
            ...
          }
  # source: go/missing-runlock-on-rwmutex.yaml
  - id: missing-runlock-on-rwmutex
    message: >-
      Missing `RUnlock` on an `RWMutex` (`$T` variable) lock before returning from a function
    languages: [go]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-667: Improper Locking"
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: HIGH
      impact: MEDIUM
      technology: [--no-technology--]
      description: "Missing `RUnlock` on an `RWMutex` lock before returning from a function"
      references:
        - https://pkg.go.dev/sync#RWMutex
        - https://blog.trailofbits.com/2020/06/09/how-to-check-if-a-mutex-is-locked-in-go/

    patterns:
      - pattern-either:
          - pattern: panic(...)
          - pattern: return ...
      - metavariable-pattern:
          metavariable: $T
          patterns:
            - pattern: |
                ($T : sync.RWMutex)
      - pattern-inside: |
          $T.RLock()
          ...
      - pattern-not-inside: |
          $T.RUnlock()
          ...
      - pattern-not-inside: |
          defer $T.RUnlock()
          ...
      - pattern-not-inside: |
          defer func(...) {
            ...
            $T.RUnlock()
            ...
          }(...)
          ...
      - pattern-not-inside: |
          $FOO(..., ..., func(...) { 
              ... 
          })
      - pattern-not-inside: |
          return func(...) {
              ...
              $T.RUnlock()
              ...
          }
