rules:
  # source: javascript/apollo-graphql/schema-directives.yaml
  - id: schema-directives
    message: >-
      The Apollo GraphQL uses the 'schemaDirectives' option. This works in ApolloServer v2, but does nothing in version >=3. Depending on what the directives are used for, this can expose authenticated endpoints, disable rate limiting, and more. See the references on how to create custom directives in v3 and v4.
    languages: [js, ts]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-686: Function Call With Incorrect Argument Type"
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology:
        - graphql
        - apollo-graphql-server
      description: "Use of outdated ApolloServer option 'schemaDirectives'"
      references:
        - https://www.apollographql.com/docs/apollo-server/schema/directives/#custom-directives

    pattern-either:
      - pattern: |
          new ApolloServer({..., schemaDirectives: ..., ...})
  # source: javascript/apollo-graphql/v3-cors-express.yaml
  # Rule default CORS policies in the express powered apollo-server
  - id: v3-express-no-cors
    languages: [js, ts]
    message: >-
      The Apollo GraphQL server lacks a CORS policy. By default, the server uses the Access-Control-Allow-Origin HTTP header with the wildcard value (*).
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      subcategory: [vuln]
      confidence: HIGH
      likelihood: LOW
      impact: LOW
      technology:
        - graphql
        - apollo-graphql-server
        - apollo-graphql-server-v3
      description: "Lack of CORS policy"
      references:
        - https://www.apollographql.com/docs/apollo-server/v3/security/cors#configuring-cors-options-for-apollo-server

    patterns:
      - pattern-either:
          - pattern-inside: |
              $X = require('apollo-server-express');
              ...
          - pattern-inside: |
              import 'apollo-server-express';
              ...
      - pattern: |
          $X = new ApolloServer({...})
      - pattern-not-inside: |
          $X = new ApolloServer({...})
          ...
          $X.applyMiddleware({..., cors: ..., ...})
  # Rule for bad CORS policies in the express powered apollo-server
  - id: v3-express-bad-cors
    languages: [js, ts]
    message: >-
      The Apollo GraphQL server is setup with a CORS policy that reflects any origin, or with a regex that has known flaws.
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      technology:
        - graphql
        - apollo-graphql-server
        - apollo-graphql-server-v3
      description: "Bad CORS policy"
      references:
        - https://www.apollographql.com/docs/apollo-server/v3/security/cors#configuring-cors-options-for-apollo-server
    mode: taint

    pattern-sources:
      - patterns:
          - pattern-inside: |
              { origin: $BAD_CORS_ORIGIN }
          - metavariable-pattern:
              metavariable: $BAD_CORS_ORIGIN
              pattern-either:
                # 'true' mean that every origin is reflected
                - pattern: |
                    true
                - patterns:
                    # pattern alone or inside an array
                    - pattern-either:
                        - pattern: |
                            $CORS_SINGLE_ORIGIN
                        - pattern: |
                            [..., $CORS_SINGLE_ORIGIN, ...]
                    - metavariable-pattern:
                        metavariable: $CORS_SINGLE_ORIGIN
                        pattern-either:
                          # the '.' character is not escaped
                          - pattern-regex: ^/.*[^\\]\..*/$
                          # the regex does not end with '$'
                          - pattern-regex: ^/.*[^$]/$
                          # An attacker can make requests from ‘null’ origins
                          - pattern: |
                              'null'
    pattern-sinks:
      - patterns:
          # The ApolloServer comes from the 'apollo-server-express' package
          - pattern-either:
              - pattern-inside: |
                  $X = require('apollo-server-express');
                  ...
              - pattern-inside: |
                  import 'apollo-server-express';
                  ...
          - pattern-either:
              # The ApolloServer receives a CORS policy directly
              - patterns:
                  - pattern-inside: |
                      $X = new ApolloServer({...})
                      ...
                      $X.applyMiddleware({...})
                  - pattern: |
                      $X.applyMiddleware({..., cors: $CORS_ORIGIN, ...})
          # This tells Semgrep that the sink is only the $CORS_ORIGIN variable
          - focus-metavariable: $CORS_ORIGIN
