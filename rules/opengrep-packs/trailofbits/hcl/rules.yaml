rules:
  # source: hcl/nomad/docker-hardcoded-password.yaml
  - id: docker-hardcoded-password
    message: |
      Found Nomad task using Docker auth with hardcoded password
    languages: [hcl]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      subcategory: [audit]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [nomad, docker, podman]
      references:
        - https://developer.hashicorp.com/nomad/docs/drivers/docker#password
    patterns:
      - pattern-inside: |
          task "..." {
            ...
            driver = "$RUNTIME"
            ...
            config {
              ...
              auth {
                ...
              }
              ...
            }
            ...
          }
      - pattern: password = "..."
      - metavariable-regex:
          metavariable: $RUNTIME
          regex: (docker|podman)
  # source: hcl/nomad/docker-privileged-mode.yaml
  - id: docker-privileged-mode
    message: |
      Found Nomad task using Docker containers in privileged mode
    languages: [hcl]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-250: Execution with Unnecessary Privileges"
      subcategory: [audit]
      confidence: HIGH
      likelihood: MEDIUM
      impact: LOW
      technology: [nomad, docker, podman]
      references:
        - https://developer.hashicorp.com/nomad/docs/drivers/docker#privileged
        - https://developer.hashicorp.com/nomad/docs/drivers/docker#allow_privileged
    pattern-either:
      - patterns:
          - pattern-inside: |
              task "..." {
                ...
                config {
                  ...
                }
                ...
              }
          - pattern: privileged = true
      - patterns:
          - pattern-inside: |
              plugin "$RUNTIME" {
                ...
                config {
                  ...
                }
                ...
              }
          - pattern: allow_privileged = true
          - metavariable-regex:
              metavariable: $RUNTIME
              regex: (docker|podman)
