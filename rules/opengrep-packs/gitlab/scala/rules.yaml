      cwe: "CWE-326"
      owasp:
      - "A3:2017-Sensitive Data Exposure"
      - "A02:2021-Cryptographic Failures"
      - "A04:2025-Cryptographic Failures"
      shortDescription: "Inadequate Encryption Strength"
      technology:
      - "scala"
      security-severity: "Medium"
    patterns:
    - pattern-inside: |-
        javax.crypto.Cipher.getInstance("$ALG")
    - metavariable-regex:
        metavariable: "$ALG"
        regex: "^(DES)/.*"
