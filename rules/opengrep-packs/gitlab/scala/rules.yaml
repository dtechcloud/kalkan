  # source: scala/ssrf/rule-SSRF.yml
  # yamllint disable
  # License: MIT (c) GitLab Inc.
  # yamllint enable
  - id: "scala_ssrf_rule-SSRF"
    languages:
    - "scala"
    message: |
      Server-Side Request Forgery occur when a web server executes a request to a user supplied
      destination parameter that is not validated. Such vulnerabilities could allow an attacker to
      access internal services or to launch attacks from your web server.
    metadata:
      category: "security"
      cwe: "CWE-918"
      owasp:
      - "A10:2021-Server-Side Request Forgery"
      - "A01:2025-Broken Access Control"
      shortDescription: "Server-Side Request Forgery (SSRF)"
      security-severity: "Low"
    pattern-either:
    - patterns:
      - pattern-either:
        - pattern-inside: |
            import java.net._
            ...
        - pattern-inside: |
            import java.net.URL
            ...
        - pattern-inside: |
            import java.net.URI
            ...
      - pattern: "new $TYPE(...). ... .$FUNC"
      - pattern-not: "new $TYPE(\"...\"). ... .$FUNC"
      - metavariable-pattern:
          metavariable: "$FUNC"
          pattern-either:
          - pattern: "connect"
          - pattern: "GetContent"
          - pattern: "openConnection"
          - pattern: "openStream"
          - pattern: "getContent"
      - metavariable-pattern:
          metavariable: "$TYPE"
          pattern-either:
          - pattern: "URL"
          - pattern: "java.net.URL"
          - pattern: "URI"
          - pattern: "java.net.URI"
    - patterns:
      - pattern-either:
        - pattern-inside: |
            import java.net.*;
            ...
        - pattern-inside: |
            import java.net.InetSocketAddress;
            ...
      - pattern: |
          new InetSocketAddress(..., $PORT)
      - pattern-not: |
          new InetSocketAddress("...", $PORT)
    severity: "ERROR"
