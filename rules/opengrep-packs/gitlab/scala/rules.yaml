      - pattern: "$WRITER.write($DATA,...);"
      - pattern: "$DATA"
    - patterns:
      - pattern-inside: |-
          def $FUNC(..., $RES: HttpServletResponse, ...): $TYPE = {...}
      - pattern: "$RES.getWriter.write($DATA,...);"
      - pattern: "$DATA"
