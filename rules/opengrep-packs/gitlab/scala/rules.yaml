    message: |
      The method identified is susceptible to injection. The input should be validated and properly
      escaped.
    metadata:
      category: "security"
      cwe: "CWE-89"
      owasp:
      - "A1:2017-Injection"
      - "A03:2021-Injection"
      - "A05:2025-Injection"
