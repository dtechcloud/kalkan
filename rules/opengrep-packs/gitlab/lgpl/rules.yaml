          $CON.query(<... $SQL ...>, ...)
      - pattern: |
          $INP = <... $REQ.$QUERY ...>;
          ...
          $SQL = <... $INP ...>;
          ...
          $CON.query(<... $SQL ...>, ...)
      - pattern: |
          $CON.query(`...${...}...`, ...)
      - pattern: |
          $CON.query("..."+...+"...", ...)
      - pattern: |
          $SQL = <... $INP ...>;
          ...
          $CON.query(<... $SQL ...>, ...)
