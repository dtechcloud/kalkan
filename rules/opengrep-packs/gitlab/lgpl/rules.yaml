      security-severity: "CRITICAL"

    mode: "taint"
    pattern-sanitizers:
      - patterns:
          # a string that might be empty
          - metavariable-pattern:
              metavariable: "$S0"
              pattern-either:
                - pattern: "..."
                - pattern: '""'
          # replace pattern should include a character class with \r and \n
          - metavariable-pattern:
              metavariable: "$PATTERN"
              patterns:
