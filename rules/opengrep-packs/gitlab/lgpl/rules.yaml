    severity: "ERROR"

    pattern-either:
      - patterns:
          - pattern-inside: |
              $FILES = ($SFU: ServletFileUpload).parseRequest(($REQ: $X.servlet.http.HttpServletRequest?))
              ...
              for($ITEM in $FILES) {
                ...
              }
          - pattern: $ITEM.getName()
      - pattern: "($PART: $X.servlet.http.Part).getSubmittedFileName()"
