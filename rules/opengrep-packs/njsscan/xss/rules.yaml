rules:
  # source: rules/xss/xss_dom.yaml
  - id: dom_xss
    mode: taint
    pattern-sources:
      - pattern: document.location.$PROP
      - pattern: location.hash
      - pattern: location.search
      - pattern: document.URL
      - pattern: document.documentURI
      - pattern: document.referrer
      - pattern: window.name
      - pattern: $EL.textContent
      - pattern: $EL.innerText
      - pattern: $EL.getAttribute(...)
    pattern-sanitizers:
      - pattern: DOMPurify.sanitize(...)
      - pattern: sanitizeHtml(...)
      - pattern: encodeURIComponent(...)
      - pattern: $X.escapeHtml(...)
    pattern-sinks:
      - pattern: $EL.innerHTML = $SINK
      - pattern: $EL.outerHTML = $SINK
      - pattern: $EL.insertAdjacentHTML($POS, $SINK)
      - pattern: document.write($SINK)
      - pattern: document.writeln($SINK)
      - pattern: $EL.html($SINK)
    message: >-
      DOM-derived text is written back to the page as HTML. The value read from
      the DOM (or the URL) reaches an HTML interpretation sink such as innerHTML,
      outerHTML, insertAdjacentHTML or document.write, which results in DOM Cross
      Site Scripting. Sanitize the value with DOMPurify.sanitize() before writing
      it, or assign it with textContent so that it is never parsed as HTML.
    languages:
      - javascript
    severity: ERROR
    metadata:
      owasp-web: a3
      cwe: cwe-79
  # source: rules/xss/xss_serialize_js.yaml
  - id: xss_serialize_javascript
    patterns:
      - pattern-inside: |
          $S = require('serialize-javascript')
          ...
      - pattern-not-inside: escape(...)
      - pattern-not-inside: encodeURI(...)
      - pattern: |
          $S(..., {unsafe: true})
    message: >-
      Untrusted user input reaching `serialize-javascript` with `unsafe`
      attribute can cause Cross Site Scripting (XSS).
    severity: WARNING
    languages:
      - javascript
    metadata:
      owasp-web: a1
      cwe: cwe-80
  # source: rules/xss/xss_templates.yaml
  - id: handlebars_safestring
    pattern-either:
      - pattern: $X.SafeString(...)
      - pattern: new Handlebars.SafeString(...)
    message: >-
      When you use SafeString or triple curly braces ({{{ }}}), Handlebars does not escape the content, allowing raw HTML to be rendered in the browser. This is useful if you want to insert valid HTML content into your template, like bold text (<strong>) or links (<a>), but it becomes dangerous if you are dealing with untrusted or user-generated content, as it can cause a Cross-site scripting attack (XSS). You should only use SafeString when the content is trusted. For example, if the content is generated by the server and does not come from user input or an untrusted source. If you are dealing with user-generated content, make sure to sanitize it to remove any malicious scripts before marking it as "safe".
    languages:
      - javascript
    severity: ERROR
    metadata:
      owasp-web: a1
      cwe: cwe-79
  - id: handlebars_noescape
    patterns:
      - pattern: |
          $X.compile(..., {noEscape: true}, ...)
    message: >-
      Disabling Escaping in Handlebars is not a secure behaviour. This can
      introduce XSS vulnerabilties.
    languages:
      - javascript
    severity: ERROR
    metadata:
      owasp-web: a1
      cwe: cwe-80
  - id: squirrelly_autoescape
    pattern: $X.autoEscaping(false)
    message: >-
      Handlebars SafeString will not escape the data passed through it.
      Untrusted user input passing through SafeString can cause XSS.
    languages:
      - javascript
    severity: ERROR
    metadata:
      owasp-web: a1
      cwe: cwe-79
