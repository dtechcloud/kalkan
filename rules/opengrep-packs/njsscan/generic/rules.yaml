  - id: node_password
    patterns:
      - pattern-not: $X = ''
      - pattern-not: $OBJ[$X] = ''
      - pattern-not: $OBJ.$X = ''
      - pattern-either:
          - pattern: |
              $X = '...'
      - metavariable-regex:
          metavariable: '$X'
          regex: '(?i:.*pass.*)'
    message: >-
      A hardcoded password in plain text is identified. Store it properly in an
      environment variable.
    languages:
      - javascript
    severity: ERROR
    metadata:
      owasp-web: a3
      cwe: cwe-798
  - id: node_api_key
