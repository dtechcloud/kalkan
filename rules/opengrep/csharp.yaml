      - pattern: $CIPHER.DecryptEcb(...)

  - id: kalkan.csharp.cors.any-origin-with-credentials
    languages: [csharp]
    severity: WARNING
    message: >-
      The CORS policy accepts every origin (SetIsOriginAllowed(_ => true) or AllowAnyOrigin()) and
      also allows credentials. Any web site can then send authenticated requests and read the
      answers. List the trusted origins with WithOrigins().
    metadata:
      cwe:
        - "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      kalkan_class: cors
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      owasp:
        - "A01:2021 - Broken Access Control"
        - "A05:2021 - Security Misconfiguration"
      references:
        - https://cwe.mitre.org/data/definitions/942.html
        - https://learn.microsoft.com/en-us/aspnet/core/security/cors
      category: security
      technology: [csharp, aspnetcore]
    patterns:
      - pattern: $CHAIN.AllowCredentials()
      - metavariable-pattern:
          metavariable: $CHAIN
          patterns:
            - pattern-either:
                - pattern: <... $POLICY.SetIsOriginAllowed($ORIGIN => true) ...>
                - pattern: <... $POLICY.SetIsOriginAllowed(_ => true) ...>
                - pattern: <... $POLICY.AllowAnyOrigin() ...>
