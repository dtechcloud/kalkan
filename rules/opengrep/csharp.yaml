  - id: kalkan.csharp.crypto.weak-cipher
    languages: [csharp]
    severity: WARNING
    message: >-
      This code encrypts with a broken cipher (DES, 3DES, RC2) or with ECB mode. ECB leaks
      patterns of the plaintext. Use AesGcm with a random nonce.
    metadata:
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      kalkan_class: crypto
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      owasp:
        - "A02:2021 - Cryptographic Failures"
      references:
        - https://cwe.mitre.org/data/definitions/327.html
        - https://learn.microsoft.com/en-us/dotnet/api/system.security.cryptography.aesgcm
      category: security
      technology: [csharp, dotnet]
    pattern-either:
      - pattern: DES.Create(...)
      - pattern: TripleDES.Create(...)
      - pattern: RC2.Create(...)
      - pattern: new DESCryptoServiceProvider()
      - pattern: new TripleDESCryptoServiceProvider()
      - pattern: new RC2CryptoServiceProvider()
      - pattern: CipherMode.ECB
