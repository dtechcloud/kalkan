# SPDX-License-Identifier: MIT
#
# CI for kalkan. Every action is pinned by its full commit SHA; the
# comment names the release. The workflow uses no secrets and only reads the repository.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install kalkan with the development tools
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Check the format (ruff format)
        run: ruff format --check .

      - name: Check the vendored third_party copies
        run: python scripts/vendor_third_party.py --check

      - name: Check the generated host and plugin files
        run: python scripts/sync_host_files.py --check

      - name: Check the plugin bundle (manifests and engine wheel)
        run: python scripts/build_plugin.py --check

      - name: Test (no external scanners, no Docker)
        run: pytest -m "not tools and not docker"

  workflows:
    # The workflow files: actionlint (syntax, expressions, shellcheck on the run steps) and zizmor
    # (security: injection, permissions, credentials, pins). kalkan installs the three tools from
    # its manifest, so they are the pinned versions with a checked SHA-256.
    name: workflow lint (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install kalkan
        run: python -m pip install -e .

      - name: Install the pinned actionlint, shellcheck and zizmor
        run: kalkan tools install --json actionlint shellcheck zizmor > "$RUNNER_TEMP/tools.json"

      - name: Lint the workflows (actionlint with shellcheck)
        run: |
          tool() { jq -er --arg n "$1" '.results[] | select(.name == $n) | .path' "$RUNNER_TEMP/tools.json"; }
          "$(tool actionlint)" -no-color -shellcheck="$(tool shellcheck)"

      - name: Audit the workflows (zizmor, with the online audits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zizmor="$(jq -er '.results[] | select(.name == "zizmor") | .path' "$RUNNER_TEMP/tools.json")"
          "$zizmor" --no-progress --format=github .github/workflows

  docker:
    # Optional: a failure here does not fail the workflow. The image is built, never pushed.
    name: docker image (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image (with Hadolint)
        run: docker build -f docker/Dockerfile -t kalkan:ci .

      - name: Run kalkan --version in the image
        run: docker run --rm kalkan:ci --version

      - name: Run kalkan doctor in the image
        run: docker run --rm kalkan:ci doctor --json

      - name: Build the image without Hadolint
        run: docker build -f docker/Dockerfile --build-arg WITH_HADOLINT=false -t kalkan:ci-no-hadolint .

      - name: Make sure that the image without Hadolint has no Hadolint binary
        run: docker run --rm --entrypoint sh kalkan:ci-no-hadolint -c 'test ! -e /opt/kalkan/.tools/hadolint'

      - name: Show the image sizes
        run: docker image ls kalkan
