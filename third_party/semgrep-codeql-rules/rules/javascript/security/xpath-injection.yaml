rules:
  - id: codeql-js-xpath-injection
    message: >-
      XPath query built from user input may be vulnerable to XPath injection.
      Use parameterized XPath queries or validate input.
    severity: ERROR
    languages:
      - javascript
      - typescript
    metadata:
      category: security
      cwe: "CWE-643: Improper Neutralization of Data within XPath Expressions"
      technology:
        - javascript
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/643.html
        - https://github.com/github/codeql/blob/main/javascript/ql/src/Security/CWE-643/XPathInjection.ql
      source-rule-url: https://github.com/github/codeql/blob/main/javascript/ql/src/Security/CWE-643/XPathInjection.ql
    pattern-either:
      - pattern: $DOC.evaluate($QUERY + $INPUT, ...)
      - pattern: $DOC.evaluate(`...${$INPUT}...`, ...)
      - pattern: xpath.select($QUERY + $INPUT, ...)
      - pattern: xpath.select(`...${$INPUT}...`, ...)
