rules:
  - id: codeql-js-log-injection
    message: >-
      User input written to logs without sanitization may allow log injection
      attacks. Sanitize newlines and control characters.
    severity: WARNING
    languages:
      - javascript
      - typescript
    metadata:
      category: security
      cwe: "CWE-117: Improper Output Neutralization for Logs"
      technology:
        - nodejs
      confidence: LOW
      likelihood: MEDIUM
      impact: LOW
      subcategory:
        - audit
      references:
        - https://cwe.mitre.org/data/definitions/117.html
        - https://github.com/github/codeql/blob/main/javascript/ql/src/Security/CWE-117/LogInjection.ql
      source-rule-url: https://github.com/github/codeql/blob/main/javascript/ql/src/Security/CWE-117/LogInjection.ql
    pattern-either:
      - pattern: console.log(req.query.$PARAM)
      - pattern: console.log(req.body.$PARAM)
      - pattern: console.log(req.params.$PARAM)
      - pattern: console.error(req.query.$PARAM)
      - pattern: console.error(req.body.$PARAM)
      - pattern: logger.info(req.query.$PARAM)
      - pattern: logger.error(req.query.$PARAM)
