rules:
  - id: codeql-js-hardcoded-password
    message: >-
      Hardcoded password detected. Passwords should be stored securely in
      environment variables or a secrets manager.
    severity: ERROR
    languages:
      - javascript
      - typescript
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      technology:
        - javascript
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://github.com/github/codeql/blob/main/javascript/ql/src/Security/CWE-798/HardcodedCredentials.ql
      source-rule-url: https://github.com/github/codeql/blob/main/javascript/ql/src/Security/CWE-798/HardcodedCredentials.ql
    pattern-either:
      - pattern: password = "..."
      - pattern: password = '...'
      - pattern: password = `...`
      - pattern: PASSWORD = "..."
      - pattern: const password = "..."
      - pattern: let password = "..."
      - pattern: var password = "..."
      - pattern: secret = "..."
      - pattern: apiKey = "..."
      - pattern: api_key = "..."
      - pattern: secretKey = "..."
      - pattern: authToken = "..."

  - id: codeql-js-hardcoded-private-key
    message: >-
      Hardcoded private key detected. Private keys should be loaded from secure
      storage.
    severity: ERROR
    languages:
      - javascript
      - typescript
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      technology:
        - javascript
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://github.com/github/codeql/blob/main/javascript/ql/src/Security/CWE-798/HardcodedCredentials.ql
      source-rule-url: https://github.com/github/codeql/blob/main/javascript/ql/src/Security/CWE-798/HardcodedCredentials.ql
    pattern-regex: '-----BEGIN\s+(RSA\s+)?PRIVATE\s+KEY-----'
