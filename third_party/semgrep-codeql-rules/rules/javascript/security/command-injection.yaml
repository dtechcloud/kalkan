rules:
  - id: codeql-js-command-injection
    message: >-
      Command built from user input may be vulnerable to command injection.
      Use child_process.execFile with an array of arguments instead.
    severity: ERROR
    languages:
      - javascript
      - typescript
    metadata:
      category: security
      cwe: "CWE-078: Improper Neutralization of Special Elements used in an OS Command"
      technology:
        - javascript
        - nodejs
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/78.html
        - https://github.com/github/codeql/blob/main/javascript/ql/src/Security/CWE-078/CommandInjection.ql
      source-rule-url: https://github.com/github/codeql/blob/main/javascript/ql/src/Security/CWE-078/CommandInjection.ql
    pattern-either:
      - pattern: child_process.exec($CMD + $VAR, ...)
      - pattern: child_process.exec(`...${$VAR}...`, ...)
      - pattern: exec($CMD + $VAR, ...)
      - pattern: exec(`...${$VAR}...`, ...)
      - pattern: child_process.execSync($CMD + $VAR, ...)
      - pattern: child_process.execSync(`...${$VAR}...`, ...)
      - pattern: execSync($CMD + $VAR, ...)
      - pattern: execSync(`...${$VAR}...`, ...)
      - pattern: child_process.spawn($CMD, $ARGS, $OPTS)
      - pattern: spawn($CMD, $ARGS, $OPTS)

  - id: codeql-js-code-injection
    message: >-
      Using eval() with user input can lead to arbitrary code execution.
      Avoid using eval with untrusted data.
    severity: ERROR
    languages:
      - javascript
      - typescript
    metadata:
      category: security
      cwe: "CWE-094: Improper Control of Generation of Code"
      technology:
        - javascript
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/94.html
        - https://github.com/github/codeql/blob/main/javascript/ql/src/Security/CWE-094/CodeInjection.ql
      source-rule-url: https://github.com/github/codeql/blob/main/javascript/ql/src/Security/CWE-094/CodeInjection.ql
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
      - pattern: setTimeout($CODE, ...)
      - pattern: setInterval($CODE, ...)
