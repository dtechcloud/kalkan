rules:
  - id: codeql-js-regex-injection
    message: >-
      Regular expression built from user input may be vulnerable to ReDoS.
      Validate or escape user input before using in regex.
    severity: WARNING
    languages:
      - javascript
      - typescript
    metadata:
      category: security
      cwe: "CWE-730: OWASP Top Ten 2017 Category A7 - Cross-Site Scripting (XSS)"
      technology:
        - javascript
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/730.html
        - https://github.com/github/codeql/blob/main/javascript/ql/src/Security/CWE-730/RegExpInjection.ql
      source-rule-url: https://github.com/github/codeql/blob/main/javascript/ql/src/Security/CWE-730/RegExpInjection.ql
    pattern-either:
      - pattern: new RegExp($INPUT)
      - pattern: new RegExp($INPUT, ...)
      - pattern: RegExp($INPUT)
      - pattern: RegExp($INPUT, ...)
