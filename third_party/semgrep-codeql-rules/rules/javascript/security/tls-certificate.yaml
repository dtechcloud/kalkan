rules:
  - id: codeql-js-disable-tls-verification
    message: >-
      TLS certificate verification is disabled. This makes the connection
      vulnerable to man-in-the-middle attacks.
    severity: ERROR
    languages:
      - javascript
      - typescript
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      technology:
        - nodejs
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/295.html
        - https://github.com/github/codeql/blob/main/javascript/ql/src/Security/CWE-295/DisablingCertificateValidation.ql
      source-rule-url: https://github.com/github/codeql/blob/main/javascript/ql/src/Security/CWE-295/DisablingCertificateValidation.ql
    pattern-either:
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = "0"
      - pattern: rejectUnauthorized = false
      - pattern: "rejectUnauthorized: false"
      - pattern: https.Agent({...})
