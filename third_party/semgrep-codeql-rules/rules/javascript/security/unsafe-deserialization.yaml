rules:
  - id: codeql-js-unsafe-deserialization
    message: >-
      Deserializing untrusted data may allow attackers to execute arbitrary
      code. Avoid deserializing user input.
    severity: ERROR
    languages:
      - javascript
      - typescript
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      technology:
        - nodejs
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/502.html
        - https://github.com/github/codeql/blob/main/javascript/ql/src/Security/CWE-502/UnsafeDeserialization.ql
      source-rule-url: https://github.com/github/codeql/blob/main/javascript/ql/src/Security/CWE-502/UnsafeDeserialization.ql
    pattern-either:
      - pattern: $SERIALIZE.unserialize(...)
      - pattern: $SERIALIZE.deserialize(...)
      - pattern: YAML.load(...)
