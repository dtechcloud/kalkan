rules:
  - id: codeql-swift-path-traversal
    message: >-
      File path built from user input may allow path traversal attacks.
      Validate and sanitize file paths.
    severity: ERROR
    languages:
      - swift
    metadata:
      category: security
      cwe: "CWE-022: Improper Limitation of a Pathname to a Restricted Directory"
      technology:
        - swift
        - ios
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/22.html
        - https://github.com/github/codeql/blob/main/swift/ql/src/queries/Security/CWE-022/PathInjection.ql
      source-rule-url: https://github.com/github/codeql/blob/main/swift/ql/src/queries/Security/CWE-022/PathInjection.ql
    pattern-either:
      - pattern: "FileManager.default.contents(atPath: $BASE + $INPUT)"
      - pattern: "String(contentsOfFile: $BASE + $INPUT, ...)"
      - pattern: "Data(contentsOf: URL(fileURLWithPath: $BASE + $INPUT))"
