rules:
  - id: codeql-swift-hardcoded-password
    message: >-
      Hardcoded password detected. Passwords should be stored securely in
      the Keychain or a secrets manager.
    severity: ERROR
    languages:
      - swift
    metadata:
      category: security
      cwe: "CWE-259: Use of Hard-coded Password"
      technology:
        - swift
        - ios
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/259.html
        - https://github.com/github/codeql/blob/main/swift/ql/src/queries/Security/CWE-259/ConstantPassword.ql
      source-rule-url: https://github.com/github/codeql/blob/main/swift/ql/src/queries/Security/CWE-259/ConstantPassword.ql
    pattern-either:
      - pattern: let password = "..."
      - pattern: var password = "..."
      - pattern: let secret = "..."
      - pattern: let apiKey = "..."

  - id: codeql-swift-hardcoded-encryption-key
    message: >-
      Hardcoded encryption key detected. Keys should be derived securely or
      stored in the Keychain.
    severity: ERROR
    languages:
      - swift
    metadata:
      category: security
      cwe: "CWE-321: Use of Hard-coded Cryptographic Key"
      technology:
        - swift
        - ios
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/321.html
        - https://github.com/github/codeql/blob/main/swift/ql/src/queries/Security/CWE-321/HardcodedEncryptionKey.ql
      source-rule-url: https://github.com/github/codeql/blob/main/swift/ql/src/queries/Security/CWE-321/HardcodedEncryptionKey.ql
    pattern-either:
      - pattern: let encryptionKey = "..."
      - pattern: "let key = \"...\".data(using: .utf8)"

  - id: codeql-swift-hardcoded-private-key
    message: >-
      Hardcoded private key detected. Private keys should be stored in the
      Keychain.
    severity: ERROR
    languages:
      - swift
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      technology:
        - swift
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/798.html
    pattern-regex: '-----BEGIN\s+(RSA\s+)?PRIVATE\s+KEY-----'
