rules:
  - id: codeql-generic-hardcoded-private-key
    message: >-
      Hardcoded private key detected. Private keys should be stored securely
      in files with restricted permissions or a secrets manager.
    severity: ERROR
    languages:
      - generic
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://github.com/github/codeql/blob/main/python/ql/src/Security/CWE-798/HardcodedCredentials.ql
      source-rule-url: https://github.com/github/codeql/blob/main/python/ql/src/Security/CWE-798/HardcodedCredentials.ql
    pattern-regex: '-----BEGIN\s+(RSA\s+|DSA\s+|EC\s+|OPENSSH\s+|PGP\s+)?PRIVATE\s+KEY-----'

  - id: codeql-generic-hardcoded-aws-key
    message: >-
      Hardcoded AWS access key detected. Use IAM roles, environment variables,
      or AWS credentials file instead.
    severity: ERROR
    languages:
      - generic
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/798.html
    pattern-regex: 'AKIA[0-9A-Z]{16}'

  - id: codeql-generic-hardcoded-github-token
    message: >-
      Hardcoded GitHub token detected. Use environment variables or a secrets
      manager instead.
    severity: ERROR
    languages:
      - generic
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/798.html
    pattern-regex: 'gh[pousr]_[A-Za-z0-9_]{36,}'

  - id: codeql-generic-hardcoded-slack-token
    message: >-
      Hardcoded Slack token detected. Use environment variables or a secrets
      manager instead.
    severity: ERROR
    languages:
      - generic
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/798.html
    pattern-regex: 'xox[baprs]-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24}'
