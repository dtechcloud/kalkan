rules:
  - id: codeql-ruby-xss-raw
    message: >-
      Using raw or html_safe with user input may lead to XSS. Ensure the input
      is properly sanitized.
    severity: ERROR
    languages:
      - ruby
    metadata:
      category: security
      cwe: "CWE-079: Improper Neutralization of Input During Web Page Generation"
      technology:
        - rails
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/79.html
        - https://github.com/github/codeql/blob/main/ruby/ql/src/queries/security/cwe-079/ReflectedXSS.ql
      source-rule-url: https://github.com/github/codeql/blob/main/ruby/ql/src/queries/security/cwe-079/ReflectedXSS.ql
    pattern-either:
      - pattern: raw($INPUT)
      - pattern: $INPUT.html_safe
      - pattern: $STR.html_safe
