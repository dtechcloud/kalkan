rules:
  - id: codeql-ruby-open-redirect
    message: >-
      URL redirect destination from user input may allow open redirect attacks.
      Validate redirect URLs against a whitelist.
    severity: WARNING
    languages:
      - ruby
    metadata:
      category: security
      cwe: "CWE-601: URL Redirection to Untrusted Site"
      technology:
        - rails
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/601.html
        - https://github.com/github/codeql/blob/main/ruby/ql/src/queries/security/cwe-601/UrlRedirect.ql
      source-rule-url: https://github.com/github/codeql/blob/main/ruby/ql/src/queries/security/cwe-601/UrlRedirect.ql
    pattern-either:
      - pattern: redirect_to(params[...])
      - pattern: redirect_to params[...]
