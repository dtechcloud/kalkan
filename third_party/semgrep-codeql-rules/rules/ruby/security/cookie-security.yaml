rules:
  - id: codeql-ruby-insecure-cookie
    message: >-
      Cookie set without secure flag. Set secure: true to prevent transmission
      over unencrypted connections.
    severity: WARNING
    languages:
      - ruby
    metadata:
      category: security
      cwe: "CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"
      technology:
        - rails
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/614.html
        - https://github.com/github/codeql/blob/main/ruby/ql/src/queries/security/cwe-614/InsecureCookie.ql
      source-rule-url: https://github.com/github/codeql/blob/main/ruby/ql/src/queries/security/cwe-614/InsecureCookie.ql
    patterns:
      - pattern: "cookies[$NAME] = { value: $VALUE, ... }"
      - pattern-not: "cookies[$NAME] = { value: $VALUE, ..., secure: true, ... }"

  - id: codeql-ruby-cookie-missing-httponly
    message: >-
      Cookie set without httponly flag. Set httponly: true to prevent
      client-side script access.
    severity: WARNING
    languages:
      - ruby
    metadata:
      category: security
      cwe: "CWE-1004: Sensitive Cookie Without 'HttpOnly' Flag"
      technology:
        - rails
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/1004.html
        - https://github.com/github/codeql/blob/main/ruby/ql/src/queries/security/cwe-1004/CookieWithoutHttpOnly.ql
      source-rule-url: https://github.com/github/codeql/blob/main/ruby/ql/src/queries/security/cwe-1004/CookieWithoutHttpOnly.ql
    patterns:
      - pattern: "cookies[$NAME] = { value: $VALUE, ... }"
      - pattern-not: "cookies[$NAME] = { value: $VALUE, ..., httponly: true, ... }"
