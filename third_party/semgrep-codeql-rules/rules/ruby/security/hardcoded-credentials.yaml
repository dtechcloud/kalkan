rules:
  - id: codeql-ruby-hardcoded-password
    message: >-
      Hardcoded password detected. Passwords should be stored securely in
      environment variables or a secrets manager.
    severity: ERROR
    languages:
      - ruby
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      technology:
        - ruby
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://github.com/github/codeql/blob/main/ruby/ql/src/queries/security/cwe-798/HardcodedCredentials.ql
      source-rule-url: https://github.com/github/codeql/blob/main/ruby/ql/src/queries/security/cwe-798/HardcodedCredentials.ql
    pattern-either:
      - pattern: password = "..."
      - pattern: PASSWORD = "..."
      - pattern: secret = "..."
      - pattern: api_key = "..."
      - pattern: API_KEY = "..."

  - id: codeql-ruby-hardcoded-private-key
    message: >-
      Hardcoded private key detected. Private keys should be loaded from secure
      storage.
    severity: ERROR
    languages:
      - ruby
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      technology:
        - ruby
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://github.com/github/codeql/blob/main/ruby/ql/src/queries/security/cwe-798/HardcodedCredentials.ql
      source-rule-url: https://github.com/github/codeql/blob/main/ruby/ql/src/queries/security/cwe-798/HardcodedCredentials.ql
    pattern-regex: '-----BEGIN\s+(RSA\s+)?PRIVATE\s+KEY-----'
