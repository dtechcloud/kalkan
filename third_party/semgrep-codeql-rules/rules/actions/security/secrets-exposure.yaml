rules:
  - id: codeql-actions-secrets-in-env
    message: >-
      Secret exposed in environment variable that is passed to all steps.
      Consider limiting secret exposure to only the steps that need it.
    severity: WARNING
    languages:
      - yaml
    metadata:
      category: security
      cwe: "CWE-312: Cleartext Storage of Sensitive Information"
      technology:
        - github-actions
      confidence: MEDIUM
      likelihood: LOW
      impact: MEDIUM
      subcategory:
        - audit
      references:
        - https://cwe.mitre.org/data/definitions/312.html
        - https://github.com/github/codeql/blob/main/actions/ql/src/Security/CWE-312/ExcessiveSecretsExposure.ql
      source-rule-url: https://github.com/github/codeql/blob/main/actions/ql/src/Security/CWE-312/ExcessiveSecretsExposure.ql
    paths:
      include:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
    pattern-regex: 'env:\s*\n\s+\w+:\s*\$\{\{\s*secrets\.'

  - id: codeql-actions-secrets-to-artifact
    message: >-
      Secrets may be exposed in uploaded artifacts. Ensure sensitive data
      is not included in artifact paths.
    severity: ERROR
    languages:
      - yaml
    metadata:
      category: security
      cwe: "CWE-312: Cleartext Storage of Sensitive Information"
      technology:
        - github-actions
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/312.html
        - https://github.com/github/codeql/blob/main/actions/ql/src/Security/CWE-312/SecretsInArtifacts.ql
      source-rule-url: https://github.com/github/codeql/blob/main/actions/ql/src/Security/CWE-312/SecretsInArtifacts.ql
    paths:
      include:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
    pattern-regex: 'uses:\s*actions/upload-artifact.*\n.*path:\s*\.(env|secrets|credentials)'
