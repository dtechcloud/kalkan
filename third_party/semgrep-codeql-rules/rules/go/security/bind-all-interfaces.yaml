rules:
  - id: codeql-go-bind-all-interfaces
    message: >-
      Server binding to all network interfaces (0.0.0.0) may expose the service
      to unintended networks. Consider binding to a specific interface.
    severity: WARNING
    languages:
      - go
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      technology:
        - go
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      subcategory:
        - audit
      references:
        - https://cwe.mitre.org/data/definitions/200.html
    pattern-either:
      - pattern: http.ListenAndServe(":...", ...)
      - pattern: http.ListenAndServe("0.0.0.0:...", ...)
      - pattern: net.Listen("tcp", ":...")
      - pattern: net.Listen("tcp", "0.0.0.0:...")
      - pattern: $SERVER.ListenAndServe()
