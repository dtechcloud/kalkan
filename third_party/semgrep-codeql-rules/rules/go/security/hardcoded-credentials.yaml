rules:
  - id: codeql-go-hardcoded-password
    message: >-
      Hardcoded password detected. Passwords should be stored securely in
      environment variables or a secrets manager.
    severity: ERROR
    languages:
      - go
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      technology:
        - go
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://github.com/github/codeql/blob/main/go/ql/src/Security/CWE-798/HardcodedCredentials.ql
      source-rule-url: https://github.com/github/codeql/blob/main/go/ql/src/Security/CWE-798/HardcodedCredentials.ql
    pattern-either:
      - pattern: password := "..."
      - pattern: password = "..."
      - pattern: Password := "..."
      - pattern: Password = "..."
      - pattern: secret := "..."
      - pattern: secret = "..."
      - pattern: apiKey := "..."
      - pattern: apiKey = "..."
      - pattern: API_KEY := "..."
      - pattern: secretKey := "..."
      - pattern: authToken := "..."

  - id: codeql-go-hardcoded-private-key
    message: >-
      Hardcoded private key detected. Private keys should be loaded from secure
      storage.
    severity: ERROR
    languages:
      - go
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      technology:
        - go
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://github.com/github/codeql/blob/main/go/ql/src/Security/CWE-798/HardcodedCredentials.ql
      source-rule-url: https://github.com/github/codeql/blob/main/go/ql/src/Security/CWE-798/HardcodedCredentials.ql
    pattern-regex: '-----BEGIN\s+(RSA\s+)?PRIVATE\s+KEY-----'
