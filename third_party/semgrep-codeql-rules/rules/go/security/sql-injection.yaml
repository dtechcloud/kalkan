rules:
  - id: codeql-go-sql-injection
    message: >-
      SQL query built from user-controlled input may be vulnerable to SQL
      injection. Use parameterized queries instead.
    severity: ERROR
    languages:
      - go
    metadata:
      category: security
      cwe: "CWE-089: Improper Neutralization of Special Elements used in an SQL Command"
      technology:
        - go
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/89.html
        - https://github.com/github/codeql/blob/main/go/ql/src/Security/CWE-089/SqlInjection.ql
      source-rule-url: https://github.com/github/codeql/blob/main/go/ql/src/Security/CWE-089/SqlInjection.ql
    pattern-either:
      - pattern: $DB.Query($QUERY + $VAR, ...)
      - pattern: $DB.Query(fmt.Sprintf($FMT, ...), ...)
      - pattern: $DB.QueryRow($QUERY + $VAR, ...)
      - pattern: $DB.QueryRow(fmt.Sprintf($FMT, ...), ...)
      - pattern: $DB.Exec($QUERY + $VAR, ...)
      - pattern: $DB.Exec(fmt.Sprintf($FMT, ...), ...)
      - pattern: $TX.Query($QUERY + $VAR, ...)
      - pattern: $TX.Query(fmt.Sprintf($FMT, ...), ...)
      - pattern: $TX.Exec($QUERY + $VAR, ...)
      - pattern: $TX.Exec(fmt.Sprintf($FMT, ...), ...)
