rules:
  - id: codeql-csharp-hardcoded-password
    message: >-
      Hardcoded password detected. Passwords should be stored securely in
      environment variables or a secrets manager.
    severity: ERROR
    languages:
      - csharp
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      technology:
        - csharp
        - dotnet
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://github.com/github/codeql/blob/main/csharp/ql/src/Security%20Features/CWE-798/HardcodedCredentials.ql
      source-rule-url: https://github.com/github/codeql/blob/main/csharp/ql/src/Security%20Features/CWE-798/HardcodedCredentials.ql
    pattern-either:
      - pattern: string password = "...";
      - pattern: var password = "...";
      - pattern: const string password = "...";
      - pattern: string secret = "...";
      - pattern: string apiKey = "...";
      - pattern: string API_KEY = "...";

  - id: codeql-csharp-hardcoded-connection-string
    message: >-
      Hardcoded connection string with credentials detected. Use configuration
      files or environment variables.
    severity: ERROR
    languages:
      - csharp
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      technology:
        - csharp
        - dotnet
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://github.com/github/codeql/blob/main/csharp/ql/src/Security%20Features/CWE-798/HardcodedConnectionString.ql
      source-rule-url: https://github.com/github/codeql/blob/main/csharp/ql/src/Security%20Features/CWE-798/HardcodedConnectionString.ql
    pattern-regex: 'Password\s*=\s*[^;"\s]+'

  - id: codeql-csharp-hardcoded-private-key
    message: >-
      Hardcoded private key detected. Private keys should be loaded from
      secure storage.
    severity: ERROR
    languages:
      - csharp
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      technology:
        - csharp
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/798.html
    pattern-regex: '-----BEGIN\s+(RSA\s+)?PRIVATE\s+KEY-----'
