rules:
  - id: codeql-java-hardcoded-password
    message: >-
      Hardcoded password detected. Passwords should be stored securely.
    severity: ERROR
    languages:
      - java
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      technology:
        - java
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://github.com/github/codeql/blob/main/java/ql/src/Security/CWE/CWE-798/HardcodedCredentialsApiCall.ql
      source-rule-url: https://github.com/github/codeql/blob/main/java/ql/src/Security/CWE/CWE-798/HardcodedCredentialsApiCall.ql
    pattern-either:
      - pattern: String password = "...";
      - pattern: String PASSWORD = "...";
      - pattern: String secret = "...";
      - pattern: String apiKey = "...";
      - pattern: String API_KEY = "...";

  - id: codeql-java-hardcoded-private-key
    message: >-
      Hardcoded private key detected. Private keys should be loaded from secure
      storage.
    severity: ERROR
    languages:
      - java
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      technology:
        - java
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://github.com/github/codeql/blob/main/java/ql/src/Security/CWE/CWE-798/HardcodedCredentialsApiCall.ql
      source-rule-url: https://github.com/github/codeql/blob/main/java/ql/src/Security/CWE/CWE-798/HardcodedCredentialsApiCall.ql
    pattern-regex: '-----BEGIN\s+(RSA\s+)?PRIVATE\s+KEY-----'
