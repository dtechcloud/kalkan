rules:
  - id: codeql-py-jwt-decode-no-verify
    message: >-
      JWT decoded without signature verification. Always verify JWT signatures
      to prevent token forgery.
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      technology:
        - jwt
        - pyjwt
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/347.html
        - https://github.com/github/codeql/blob/main/python/ql/src/experimental/Security/CWE-347/JWTEmptyKeyOrAlgorithm.ql
      source-rule-url: https://github.com/github/codeql/blob/main/python/ql/src/experimental/Security/CWE-347/JWTEmptyKeyOrAlgorithm.ql
    pattern-either:
      - pattern: "jwt.decode($TOKEN, ..., options={\"verify_signature\": False}, ...)"
      - pattern: jwt.decode($TOKEN, ..., verify=False, ...)
      - pattern: jwt.decode($TOKEN, algorithms=["none"], ...)
      - pattern: "jwt.decode($TOKEN, options={\"verify_exp\": False, \"verify_signature\": False}, ...)"

  - id: codeql-py-jwt-empty-key
    message: >-
      JWT signed or verified with empty key. Use a strong secret key.
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      technology:
        - jwt
        - pyjwt
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/347.html
      source-rule-url: https://github.com/github/codeql/blob/main/python/ql/src/experimental/Security/CWE-347/JWTEmptyKeyOrAlgorithm.ql
    pattern-either:
      - pattern: jwt.encode($PAYLOAD, "", ...)
      - pattern: jwt.decode($TOKEN, "", ...)
      - pattern: jwt.encode($PAYLOAD, key="", ...)
      - pattern: jwt.decode($TOKEN, key="", ...)
