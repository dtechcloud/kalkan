rules:
  - id: codeql-py-hardcoded-password
    message: >-
      Hardcoded password detected. Passwords should be stored securely in
      environment variables or a secrets manager, not in source code.
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      technology:
        - python
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://github.com/github/codeql/blob/main/python/ql/src/Security/CWE-798/HardcodedCredentials.ql
      source-rule-url: https://github.com/github/codeql/blob/main/python/ql/src/Security/CWE-798/HardcodedCredentials.ql
    pattern-either:
      - pattern: password = "..."
      - pattern: PASSWORD = "..."
      - pattern: passwd = "..."
      - pattern: secret = "..."
      - pattern: SECRET = "..."
      - pattern: api_key = "..."
      - pattern: API_KEY = "..."
      - pattern: apikey = "..."
      - pattern: secret_key = "..."
      - pattern: SECRET_KEY = "..."
      - pattern: auth_token = "..."
      - pattern: access_token = "..."

  - id: codeql-py-hardcoded-private-key
    message: >-
      Hardcoded private key detected. Private keys should be stored securely
      in files with restricted permissions or a secrets manager.
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      technology:
        - python
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://github.com/github/codeql/blob/main/python/ql/src/Security/CWE-798/HardcodedCredentials.ql
      source-rule-url: https://github.com/github/codeql/blob/main/python/ql/src/Security/CWE-798/HardcodedCredentials.ql
    pattern-regex: '-----BEGIN\s+(RSA\s+)?PRIVATE\s+KEY-----'

  - id: codeql-py-hardcoded-aws-credentials
    message: >-
      Hardcoded AWS credentials detected. Use IAM roles, environment variables,
      or AWS credentials file instead.
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      technology:
        - aws
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://github.com/github/codeql/blob/main/python/ql/src/Security/CWE-798/HardcodedCredentials.ql
      source-rule-url: https://github.com/github/codeql/blob/main/python/ql/src/Security/CWE-798/HardcodedCredentials.ql
    pattern-either:
      - pattern: aws_access_key_id = "AKIA..."
      - pattern: aws_secret_access_key = "..."
      - pattern: AWS_ACCESS_KEY_ID = "AKIA..."
      - pattern: AWS_SECRET_ACCESS_KEY = "..."
      - pattern: boto3.client(..., aws_access_key_id="AKIA...", ...)
      - pattern: boto3.client(..., aws_secret_access_key="...", ...)
      - pattern: boto3.Session(..., aws_access_key_id="AKIA...", ...)
      - pattern: boto3.Session(..., aws_secret_access_key="...", ...)

  - id: codeql-py-hardcoded-database-password
    message: >-
      Hardcoded database password in connection string. Use environment
      variables or a secrets manager instead.
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      technology:
        - python
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://github.com/github/codeql/blob/main/python/ql/src/Security/CWE-798/HardcodedCredentials.ql
      source-rule-url: https://github.com/github/codeql/blob/main/python/ql/src/Security/CWE-798/HardcodedCredentials.ql
    pattern-either:
      - pattern: psycopg2.connect(..., password="...", ...)
      - pattern: pymysql.connect(..., password="...", ...)
      - pattern: mysql.connector.connect(..., password="...", ...)
      - pattern: pymongo.MongoClient("mongodb://...:...@...")
      - pattern: sqlalchemy.create_engine("...://...:...@...")
      - pattern: create_engine("...://...:...@...")
