rules:
  - id: codeql-py-weak-rsa-key
    message: >-
      RSA key size is less than 2048 bits. Keys smaller than 2048 bits are
      considered weak. Use at least 2048 bits, preferably 4096.
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe: "CWE-326: Inadequate Encryption Strength"
      technology:
        - python
        - pycryptodome
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/326.html
        - https://github.com/github/codeql/blob/main/python/ql/src/Security/CWE-326/WeakCryptoKey.ql
      source-rule-url: https://github.com/github/codeql/blob/main/python/ql/src/Security/CWE-326/WeakCryptoKey.ql
    patterns:
      - pattern-either:
          - pattern: RSA.generate($BITS, ...)
          - pattern: Crypto.PublicKey.RSA.generate($BITS, ...)
          - pattern: Cryptodome.PublicKey.RSA.generate($BITS, ...)
          - pattern: rsa.generate_private_key(..., key_size=$BITS, ...)
      - metavariable-comparison:
          metavariable: $BITS
          comparison: $BITS < 2048

  - id: codeql-py-weak-dsa-key
    message: >-
      DSA key size is less than 2048 bits. Keys smaller than 2048 bits are
      considered weak. Use at least 2048 bits.
    severity: ERROR
    languages:
      - python
    metadata:
      category: security
      cwe: "CWE-326: Inadequate Encryption Strength"
      technology:
        - python
        - pycryptodome
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/326.html
        - https://github.com/github/codeql/blob/main/python/ql/src/Security/CWE-326/WeakCryptoKey.ql
      source-rule-url: https://github.com/github/codeql/blob/main/python/ql/src/Security/CWE-326/WeakCryptoKey.ql
    patterns:
      - pattern-either:
          - pattern: DSA.generate($BITS, ...)
          - pattern: Crypto.PublicKey.DSA.generate($BITS, ...)
          - pattern: Cryptodome.PublicKey.DSA.generate($BITS, ...)
          - pattern: dsa.generate_private_key(..., key_size=$BITS, ...)
      - metavariable-comparison:
          metavariable: $BITS
          comparison: $BITS < 2048

  - id: codeql-py-weak-ec-key
    message: >-
      Elliptic curve key size is less than 224 bits. Use curves with at least
      256 bits such as P-256, P-384, or P-521.
    severity: WARNING
    languages:
      - python
    metadata:
      category: security
      cwe: "CWE-326: Inadequate Encryption Strength"
      technology:
        - python
        - cryptography
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/326.html
        - https://github.com/github/codeql/blob/main/python/ql/src/Security/CWE-326/WeakCryptoKey.ql
      source-rule-url: https://github.com/github/codeql/blob/main/python/ql/src/Security/CWE-326/WeakCryptoKey.ql
    pattern-either:
      - pattern: ec.generate_private_key(ec.SECP192R1(), ...)
      - pattern: ec.generate_private_key(ec.SECT163K1(), ...)
      - pattern: ec.generate_private_key(ec.SECT163R2(), ...)
