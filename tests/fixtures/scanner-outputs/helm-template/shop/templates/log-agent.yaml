---
# Source: shop/templates/log-agent.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kalkan-log-agent
  labels:
    app.kubernetes.io/name: shop
    app.kubernetes.io/instance: kalkan
    app.kubernetes.io/version: "1.4.2"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: log-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/component: log-agent
    spec:
      hostNetwork: true
      containers:
        - name: agent
          image: "registry.vulnapp.internal/log-agent:2.1.0"
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
          securityContext:
            privileged: true
      volumes:
        - name: varlog
          hostPath:
            path: /var/log

