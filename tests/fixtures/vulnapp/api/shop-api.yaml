openapi: 3.0.3
info:
  title: vulnapp shop API
  version: 2.4.0
  description: Cart and checkout endpoints of the shop.
servers:
  - url: http://shop.vulnapp.internal/v1
paths:
  /carts:
    post:
      operationId: createCart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartInput"
      responses:
        "201":
          description: Cart created.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimit"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooMany"
        "500":
          $ref: "#/components/responses/Failure"
  /checkout:
    post:
      operationId: checkout
      security:
        - shopKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "202":
          description: Checkout accepted.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimit"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooMany"
        "500":
          $ref: "#/components/responses/Failure"
components:
  securitySchemes:
    shopKey:
      type: apiKey
      in: query
      name: api_key
  headers:
    RateLimit:
      description: Requests allowed in the current window.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 10000
    RetryAfter:
      description: Seconds until the next request is allowed.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 3600
  responses:
    Invalid:
      description: The request is not valid.
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/RateLimit"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The API key is missing or wrong.
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/RateLimit"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooMany:
      description: Too many requests.
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/RateLimit"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Failure:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [invalid, unauthorized, rate_limited, internal]
    CartInput:
      type: object
      additionalProperties: false
      required: [sku, quantity]
      properties:
        sku:
          type: string
          maxLength: 32
          pattern: "^[A-Z0-9-]+$"
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        giftMessage:
          type: string
          pattern: "^[\\w .,!?-]*$"
    CheckoutInput:
      type: object
      required: [cartId]
      properties:
        cartId:
          type: string
          format: uuid
          maxLength: 36
