{{- if .Values.logAgent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-log-agent
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: log-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/component: log-agent
    spec:
      hostNetwork: {{ .Values.logAgent.hostNetwork }}
      containers:
        - name: agent
          image: {{ .Values.logAgent.image | quote }}
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
          securityContext:
            privileged: {{ .Values.logAgent.privileged }}
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
{{- end }}
