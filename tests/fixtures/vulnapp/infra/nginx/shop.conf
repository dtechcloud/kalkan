# Reverse proxy of the vulnapp shop.

server {
    listen 80;
    server_name shop.vulnapp.internal;
    server_tokens off;

    location /static {
        alias /srv/vulnapp/static/;
    }

    location /media/ {
        alias /srv/vulnapp/media/;
    }

    location /preview {
        proxy_pass http://$arg_host;
    }

    location /api/ {
        proxy_pass http://api.vulnapp.internal:8080;
    }
}
