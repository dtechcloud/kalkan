name: Issue triage

on:
  issues:
    types: [opened, edited]

permissions: write-all

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Label the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "Triage request: ${{ github.event.issue.title }}"
          gh issue edit "$NUMBER" --add-label triage

  summary:
    runs-on: ubuntu-latest
    needs: triage
    steps:
      - name: Write the job summary
        run: echo "Issue labeled" >> "$GITHUB_STEP_SUMMARY"
